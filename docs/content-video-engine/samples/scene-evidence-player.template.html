<title id="doctitle">Episode</title>
<style>
  :root {
    --charcoal: #25313C; --cobalt: #1769C2; --teal: #178C83;
    --sunflower: #F5B72E; --coral: #ED6A4A; --cream: #F4E6C7;
    --ink: #05131e; --slate: #081824;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #04090e; color: var(--cream);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    gap: 11px; padding: 15px;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #7d95a6; text-align: center; }
  h1 b { color: var(--sunflower); font-weight: 700; }

  #shell { width: min(96vw, 1400px); }
  #fit { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #14293a; border-radius: 6px; background: var(--slate); }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; transform-origin: top left; overflow: hidden; }

  .world { position: absolute; inset: -5%; background-size: cover; background-position: center; will-change: transform, clip-path; }

  /* Regional shading, not a global dim. The world half stays fully lit;
     darkening only begins around the midpoint and deepens toward whichever
     side the evidence occupies. --wx is the evidence side (0 = left, 1 =
     right) and --sx/--sy locate the spotlight on the active card. */
  #wash {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(var(--wdir, 90deg),
                rgba(5,19,30,0) 0%, rgba(5,19,30,0) 44%,
                rgba(5,19,30,.34) 68%, rgba(5,19,30,.62) 100%);
    transition: opacity .75s cubic-bezier(.16,1,.3,1);
  }
  #wash.on { opacity: 1; }
  /* spotlight: clear over the card, falling off into the surround */
  #spot {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(58% 62% at var(--sx, 50%) var(--sy, 50%),
                rgba(5,19,30,0) 0%, rgba(5,19,30,0) 46%,
                rgba(5,19,30,.26) 78%, rgba(5,19,30,.44) 100%);
    transition: opacity .75s cubic-bezier(.16,1,.3,1);
  }
  #spot.on { opacity: 1; }

  .dock {
    position: absolute; top: 226px; width: 720px;
    background: rgba(244,230,199,.90);
    -webkit-backdrop-filter: blur(3px) saturate(1.06); backdrop-filter: blur(3px) saturate(1.06);
    border: 4px solid var(--charcoal); border-radius: 14px;
    padding: 13px 15px 13px;
    opacity: 0;
    will-change: opacity, transform, clip-path;
  }
  /* ID-scoped: #dock-1's own left rule would otherwise outrank a class chain */
  #dock-1.solo { width: 880px; top: 196px; }
  #dock-1.solo.side-r { left: 940px; }
  #dock-1.solo.side-l { left: 100px; }
  #dock-1 { left: 136px; } #dock-2 { left: 1064px; }

  /* The skill puts mix-blend-mode: multiply on the artblock wrapper — correct
     for hand-drawn INK on a paper canvas. It does not transfer to a literal
     source document: (a) a blend group escapes the white frame and multiplies
     the artwork against the dark world plate behind the translucent dock,
     which renders it near-black; (b) literal evidence must stay literal, and
     multiply tints it. So: no blend here, and isolate the frame so nothing
     downstream can reintroduce one. */
  .slide-frame {
    border: 2px solid var(--charcoal); border-radius: 6px; overflow: hidden;
    background: #fff; isolation: isolate;
  }
  .slide-frame img { display: block; width: 100%; height: auto; }

  .rail { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
  .rail.single { grid-template-columns: 1fr; }
  /* Badges SPRING in: a back-out curve overshoots ~4% and settles. A pure
     decay curve reads as a fade; the small overshoot is what makes the pill
     land like a stamp. */
  .pill { background: rgba(37,49,60,.94); border-radius: 7px; padding: 8px 11px; display: flex; flex-direction: column;
          opacity: 0; transform: translateY(15px) scale(.9);
          transition: opacity .34s cubic-bezier(.16,1,.3,1),
                      transform .58s cubic-bezier(.34,1.56,.64,1); }
  .pill.on { opacity: 1; transform: translateY(0) scale(1); }
  .dock.solo .rail { grid-template-columns: 1fr 1fr; }
  .pill-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #9fb4c4; }
  .pill-row { display: flex; align-items: baseline; gap: 9px; margin-top: 3px; }
  .pill-num { font-size: 29px; font-weight: 800; font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pill-tag { font-size: 13px; font-weight: 700; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: rgba(244,230,199,.14); }


  .hand-unused {
    filter: drop-shadow(-12px 16px 20px rgba(0,0,0,.42));
  }

  #seam { position: absolute; top: 0; bottom: 0; width: 6px; background: var(--charcoal); box-shadow: 0 0 22px rgba(5,19,30,.9); opacity: 0; }

  #caption {
    position: absolute; left: 145px; right: 145px; bottom: 38px; text-align: center;
    line-height: 1.24; color: var(--cream); font-size: 40px; font-weight: 700;
    text-shadow: 0 2px 14px rgba(0,0,0,.94), 0 0 5px rgba(0,0,0,.85);
    transition: font-size .3s, font-weight .3s;
  }
  /* doc 29 Part 5 - kinetic groups at ONE fixed anchor. No pill, no panel. */
  #caption .cg { display: inline-block; }
  #caption .cw { display: inline-block; color: rgba(255,255,255,.80); transition: color .12s linear; }
  #caption .cw.ck { color: #c98500; }        /* keyword accent */
  #caption .cw.on { color: #fff; }           /* the word being spoken now */
  #caption .cw.ck.on { color: #e9a020; }
  /* 4.2 quiet mode - smaller, static, single fade, keywords still coloured */
  #caption.quiet { font-size: 33px; font-weight: 600; }
  #caption.quiet .cg { transform: none !important; opacity: 1 !important; }

  #bar { width: min(96vw,1400px); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: #0a1620; border: 1px solid #14293a; border-radius: 6px; padding: 10px 13px; }
  button { font: 600 12px/1 Inter, system-ui, sans-serif; letter-spacing: .04em; color: var(--cream);
           background: #10283a; border: 1px solid #1d3d54; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #16344b; }
  button:focus-visible { outline: 2px solid var(--sunflower); outline-offset: 1px; }
  #scrub { flex: 1 1 420px; accent-color: var(--sunflower); }
  #clock { font: 600 12px/1 ui-monospace, Consolas, monospace; color: #7d95a6; min-width: 108px; text-align: right; font-variant-numeric: tabular-nums; }
  #scenes { width: min(96vw,1400px); display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font: 600 10px/1 ui-monospace, Consolas, monospace; color: #7d95a6; background: #0a1620;
          border: 1px solid #14293a; border-radius: 3px; padding: 5px 7px; cursor: pointer; }
  .chip.on { color: var(--ink); background: var(--sunflower); border-color: var(--sunflower); }
</style>

<h1><b id="eptitle">Episode</b> &middot; scene-evidence lane &middot; <span id="epsub"></span></h1>

<div id="shell"><div id="fit"><div id="stage">
  <div class="world" id="wA"></div>
  <div class="world" id="wB"></div>
  <div id="wash"></div>
  <div id="spot"></div>

  <div class="dock" id="dock-1">
    <div class="slide-frame"><img id="i1" alt="evidence" /></div>
    <div class="rail" id="r1"></div>
  </div>
  <div class="dock" id="dock-2">
    <div class="slide-frame"><img id="i2" alt="evidence" /></div>
    <div class="rail" id="r2"></div>
  </div>

  <div id="seam"></div>
  <div id="caption"></div>
</div></div></div>

<div id="bar">
  <button id="play">&#9654; Play with narration</button>
  <button id="mute">Mute</button>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="timeline scrub" />
  <div id="clock">0:00 / 0:00</div>
</div>
<div id="scenes"></div>
<audio id="vo" preload="auto"></audio>

<script id="timeline-data" type="application/json">{{TIMELINE}}</script>
<script id="asset-data" type="application/json">{{URIS}}</script>
<script>
(() => {
  "use strict";
  /* $ is declared FIRST. It used to sit below the title/scrub lines that
     call it, so the whole IIFE threw ReferenceError on load and the stage
     rendered black - passing every structural check while showing nothing. */
  const $ = (id) => document.getElementById(id);
  const TL = JSON.parse(document.getElementById("timeline-data").textContent);
  const A  = JSON.parse(document.getElementById("asset-data").textContent);
  /* Runtime comes from the TIMELINE, never hardcoded. A template that
     carries the sample's duration clamps every episode to it. */
  if (TL.title) { document.title = TL.title; $("eptitle").textContent = TL.title;
    $("epsub").textContent = TL.subtitle || ""; }
  const scrub = $("scrub");
  const DUR = TL.runtime_s || (TL.scenes.length ? TL.scenes[TL.scenes.length-1].span[1] : 0);
  scrub.max = DUR;
  const stage = $("stage"), fit = $("fit");
  const fitStage = () => { stage.style.transform = `scale(${fit.clientWidth / 1920})`; };
  addEventListener("resize", fitStage); fitStage();

  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const io = (k) => k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
  /* cubic-bezier(.16,1,.3,1) ~ expo-out: a long soft settle, the reference's
     signature. cubic-bezier(.77,0,.175,1) ~ quart-in-out for the scene wipe:
     snappy, not sluggish. */
  const expoOut = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
  const quartIO = (k) => (k < 0.5 ? 8*k*k*k*k : 1 - Math.pow(-2*k+2, 4)/2);
  const ACCENT = { sunflower: "var(--sunflower)", coral: "var(--coral)", teal: "var(--teal)", cobalt: "var(--cobalt)" };

  const vo = $("vo"); vo.src = A["__audio__"];
  const wA = $("wA"), wB = $("wB"), wash = $("wash"), seam = $("seam"), cap = $("caption");
  const docks = [$("dock-1"), $("dock-2")];
  const WIPE = 0.62;

  const EXIT = 0.72, CARD_IN = 0.75;

  /* every dock carries its own lifetime: enter -> hand-led reveal -> hold
     (7s cap) -> exit. Nothing lives to the end of a scene. */
  const DOCKS = [];
  TL.scenes.forEach((sc, si) => (sc.docks || []).forEach((d) => DOCKS.push({ ...d, si, scene: sc })));
  /* COALESCE. A document that holds through three scenes is authored as one
     dock per scene, so it used to exit and re-enter at every boundary - the
     entrance re-running on a card that never left. Evidence that persists
     must persist: merge same-slide, same-slot docks separated by less than
     DOCK_JOIN into a single span. The world wipes underneath it; the card
     does not move. */
  const DOCK_JOIN = 2.5;
  DOCKS.sort((a, b) => a.enter - b.enter);
  for (let i = DOCKS.length - 1; i > 0; i--) {
    const cur = DOCKS[i], prv = DOCKS[i - 1];
    if (cur.slide === prv.slide && cur.slot === prv.slot &&
        cur.enter - prv.exit <= DOCK_JOIN) {
      prv.exit = Math.max(prv.exit, cur.exit);
      prv.badge_at = [...new Set([...(prv.badge_at||[]), ...(cur.badge_at||[])])];
      DOCKS.splice(i, 1);
    }
  }

  const chips = $("scenes");
  TL.scenes.forEach((sc, i) => {
    const c = document.createElement("button");
    c.className = "chip"; c.textContent = `${sc.scene_id} ${sc.span[0].toFixed(0)}s`;
    c.addEventListener("click", () => seek(sc.span[0] + 0.05));
    chips.appendChild(c);
  });

  const fillDock = (slot, aid) => {
    const ev = TL.evidence[aid]; if (!ev) return;
    const n = slot + 1;
    /* NO TITLE ON STAGE. The card IS the document - a label above it spends
       25px of the most valuable real estate on the frame restating what the
       viewer is already looking at. `title` stays in the timeline for
       manifests and QA; it is never drawn. */
    $("i" + n).src = A[aid] || "";
    const rail = $("r" + n); rail.innerHTML = "";
    rail.classList.toggle("single", ev.badges.length === 1);
    ev.badges.forEach((bd, bi) => {
      const el = document.createElement("div");
      el.className = "pill"; el.id = `p${n}${bi}`;
      el.innerHTML = `<span class="pill-label">${bd.label}</span><span class="pill-row">` +
        `<span class="pill-num" style="color:${ACCENT[bd.accent] || "var(--sunflower)"}">${bd.value}</span>` +
        `<span class="pill-tag" style="color:${ACCENT[bd.accent] || "var(--sunflower)"}">${bd.tag}</span></span>`;
      rail.appendChild(el);
    });
  };

  let shown = ["", ""];
  const render = (t) => {
    let si = 0;
    for (let i = 0; i < TL.scenes.length; i++) if (t >= TL.scenes[i].span[0]) si = i;
    const sc = TL.scenes[si];

    /* LAYER 1 — one continuous ken-burns per scene; incoming world wipes in */
    /* The skill's camera lock does NOT apply here. In a whiteboard
       composition the camera moves the drawing surface, so travelling during
       a stroke breaks the illusion. In this lane the drawing surface is the
       dock — already fixed in screen space — and the world plate is a
       separate layer behind it. Its parallax never moves the paper, so it
       runs continuously and independently of any reveal. */
    const paint = (el, scene) => {
      el.style.backgroundImage = `url("${A[scene.world.asset_id]}")`;
      const kb = scene.world.ken_burns;
      const p = clamp01((t - scene.span[0]) / Math.max(0.1, scene.span[1] - scene.span[0]));
      el.style.transform = `scale(${(1 + p*kb.scale).toFixed(4)}) translate(${(p*kb.x).toFixed(1)}px, ${(p*kb.y).toFixed(1)}px)`;
    };
    const prev = TL.scenes[si - 1];
    paint(wA, prev || sc);
    paint(wB, sc);
    const wk = prev ? quartIO(clamp01((t - sc.span[0]) / WIPE)) : 1;
    const dir = sc.exit === "wipe_right" ? "0 0 0 " : "0 ";
    wB.style.clipPath = sc.exit === "wipe_right"
      ? `inset(0 0 0 ${(1-wk)*100}%)` : `inset(0 ${(1-wk)*100}% 0 0)`;
    const seaming = prev && wk > 0 && wk < 1;
    seam.style.opacity = seaming ? 1 : 0;
    seam.style.transform = `translateX(${(sc.exit === "wipe_right" ? (1-wk) : wk) * 1920}px)`;

    /* LAYER 2/3 — docks live on their own schedule */
    const live = DOCKS.filter((d) => t >= d.enter && t < d.exit + EXIT);
    wash.classList.toggle("on", live.length > 0);
    spot.classList.toggle("on", live.length > 0);

    /* Which side does the evidence occupy? A solo card alternates sides by
       scene so the world is not always cropped the same way; a pair spans
       the frame, so the gradient runs bottom-up instead of sideways. */
    const soloRight = si % 2 === 0;
    if (live.length === 1) {
      wash.style.setProperty("--wdir", soloRight ? "90deg" : "270deg");
      spot.style.setProperty("--sx", soloRight ? "72%" : "28%");
      spot.style.setProperty("--sy", "46%");
    } else if (live.length > 1) {
      wash.style.setProperty("--wdir", "180deg");
      spot.style.setProperty("--sx", "50%");
      spot.style.setProperty("--sy", "44%");
    }

    for (let s = 0; s < 2; s++) {
      const d = live.find((x) => x.slot === s);
      const el = docks[s];
      if (!d) { el.style.opacity = 0; el.style.clipPath = "inset(0 100% 0 0)"; continue; }
      if (d.slide !== shown[s]) { fillDock(s, d.slide); shown[s] = d.slide; }
      const solo = live.length === 1 && s === 0;
      el.classList.toggle("solo", solo);
      el.classList.toggle("side-r", solo && soloRight);
      el.classList.toggle("side-l", solo && !soloRight);

      /* Card settle — the whole entrance. The document is simply present on
         the card; no mask, no drawing hand. Reference timing: a 0.75s
         expo-out rise with the hard-edge shadow growing alongside, so the
         card reads as a physical object landing on the plate. */
      const ck = expoOut(clamp01((t - d.enter) / CARD_IN));
      const xk = t > d.exit ? clamp01((t - d.exit) / EXIT) : 0;
      const xe = expoOut(xk);
      /* THE PAGE WIPE CLEARS THE PAGE. A card whose life ends at a scene
         boundary is part of the outgoing page, so the wipe front takes it -
         same edge, same progress. Fading it on its own schedule while the
         world slides underneath is what read as clipping. A card that
         SURVIVES the boundary is not on the outgoing page and is never
         clipped: it holds while the world changes behind it. */
      const endsHere = Math.abs(d.exit - sc.span[1]) < 0.35;
      if (seaming && endsHere) {
        el.style.clipPath = sc.exit === "wipe_right"
          ? `inset(0 ${wk * 100}% 0 0)` : `inset(0 0 0 ${wk * 100}%)`;
        el.style.opacity = clamp01((t - d.enter) / (CARD_IN * 0.55));
      } else {
        el.style.clipPath = "none";
        el.style.opacity = (1 - xe) * clamp01((t - d.enter) / (CARD_IN * 0.55));
      }
      el.style.transform = xk
        ? "translateY(" + (-22 * xe) + "px) scale(" + (1 - 0.05 * xe) + ")"
        : "translateY(" + (32 * (1 - ck)) + "px) scale(" + (0.96 + 0.04 * ck) + ")";
      const sh = 12 * ck;
      el.style.boxShadow = sh.toFixed(1) + "px " + sh.toFixed(1) + "px 0 rgba(37,49,60,.82)";

      const badges = (TL.evidence[d.slide] || {}).badges || [];
      badges.forEach((_, bi) => {
        const pill = document.getElementById(`p${s+1}${bi}`);
        const at = (d.badge_at || [])[bi];
        if (pill) pill.classList.toggle("on", at != null && t >= at && t < d.exit);
      });
    }
    const active = live;

    /* LAYER 5 — canonical caption track: resolved by time at its own
       timings, never resampled onto beat boundaries (doc 29 Part 5). */
    const quiet = active.length > 0;
    const PG = TL.caption_pages;
    if (PG) {
      /* KINETIC (doc 29 Part 5): 2-4 word groups punch into the fixed anchor,
         power3.out, scale 1.14 -> 1.0, y 12 -> 0; keywords in the accent.
         Active token by fromMs <= now < toMs (remotion page/token model).
         QUIET (4.2): while a document holds the stage the group is static -
         single fade, keywords still coloured, no punch-in. */
      let pi = -1;
      for (let i = 0; i < PG.length; i++) if (PG[i].s <= t) pi = i;
      const pg = pi >= 0 ? PG[pi] : null;
      if (pi !== cap._pi) {
        cap._pi = pi;
        cap.innerHTML = pg ? '<span class="cg">' + pg.t.map((x) =>
          '<span class="cw' + (x.k ? " ck" : "") + '">' + x.w + "</span>").join(" ")
          + "</span>" : "";
        const g = cap.firstChild;
        if (g && !quiet) {
          g.style.transition = "none";
          g.style.opacity = 0; g.style.transform = "translateY(12px) scale(1.14)";
          requestAnimationFrame(() => {
            g.style.transition = "opacity .28s cubic-bezier(.215,.61,.355,1)," +
                                 "transform .34s cubic-bezier(.215,.61,.355,1)";
            g.style.opacity = 1; g.style.transform = "translateY(0) scale(1)";
          });
        }
      }
      if (pg) { const ws = cap.querySelectorAll(".cw");
        pg.t.forEach((x, j) => { if (ws[j]) ws[j].classList.toggle("on", x.s <= t && t < x.e); }); }
      cap.style.opacity = pg ? 1 : 0;
    } else {
      let line = null;
      for (const c of TL.captions) { if (t >= c.at && t < c.until) { line = c; break; } }
      cap.textContent = line ? line.text : "";
      cap.style.opacity = line
        ? Math.min(clamp01((t - line.at) / 0.22), clamp01((line.until - t) / 0.18)) : 0;
    }
    cap.classList.toggle("quiet", quiet);

    [...chips.children].forEach((c, i) => c.classList.toggle("on", i === si));
  };

  /* transport — audio is the clock while playing */
  let t = 0, playing = false, raf = 0;
  const clock = $("clock"), playBtn = $("play");
  const fmt = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const sync = () => { scrub.value = t; clock.textContent = `${fmt(t)} / ${fmt(DUR)}`; render(t); };
  const seek = (v) => { t = Math.min(DUR, Math.max(0, v)); vo.currentTime = t; sync(); };
  const tick = () => {
    if (!playing) return;
    t = Math.min(DUR, vo.currentTime);
    if (t >= DUR) { playing = false; vo.pause(); playBtn.innerHTML = "&#9654; Replay"; }
    sync();
    if (playing) raf = requestAnimationFrame(tick);
  };
  playBtn.addEventListener("click", () => {
    if (playing) { playing = false; vo.pause(); cancelAnimationFrame(raf); playBtn.innerHTML = "&#9654; Play with narration"; }
    else {
      if (t >= DUR) seek(0);
      playing = true; vo.currentTime = t; vo.play().catch(() => {});
      playBtn.textContent = "Pause"; raf = requestAnimationFrame(tick);
    }
  });
  $("mute").addEventListener("click", () => { vo.muted = !vo.muted; $("mute").textContent = vo.muted ? "Unmute" : "Mute"; });
  scrub.addEventListener("input", () => { seek(+scrub.value); });
  sync();
})();
</script>
