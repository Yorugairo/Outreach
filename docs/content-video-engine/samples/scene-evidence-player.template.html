<meta charset="utf-8"> <!-- served by python http.server with no charset header: without this, caption dashes and ledger ink glyphs decode as cp1252 -->
<title id="doctitle">Episode</title>
<style>
  :root {
    --charcoal: #25313C; --cobalt: #1769C2; --teal: #178C83;
    --sunflower: #F5B72E; --coral: #ED6A4A; --cream: #F4E6C7;
    /* TEXT TIER - accents lifted for numerals on the charcoal pill. The
       graphic tier above is tuned for lines and chips, where 3:1 passes;
       text needs 4.5:1 and cobalt #1769C2 measures 2.42:1 on the pill -
       unreadable (operator, 2026-08-29). Lifted values measure 5.7-7.4:1. */
    --t-sunflower: #F5B72E; --t-coral: #FF8A70;
    --t-teal: #3BC9B0; --t-cobalt: #8FB3F0;
    --ink: #05131e; --slate: #081824;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #04090e; color: var(--cream);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    gap: 11px; padding: 15px;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #7d95a6; text-align: center; }
  h1 b { color: var(--sunflower); font-weight: 700; }

  #shell { width: min(96vw, 1400px); }
  #fit { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #14293a; border-radius: 6px; background: var(--slate); }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; transform-origin: top left; overflow: hidden; }

  .world { position: absolute; inset: -5%; background-size: cover; background-position: center; will-change: transform, clip-path; }

  /* LEDGER PAGE species (doc 29 s9.26, ruling E22; P35 T3). A world plate
     that IS a chart: cream page rolls out, charcoal field bleeds in leaving a
     cream-stained margin, a clean outline draws, ink writes the labels, the
     graph builds crisp from the page spec (ledger_page.v1). Every beat is a
     pure function of t (seek-safe, screenshot-render safe); the seeded blobs
     come from lpHash, never Math.random. The .lp box is the 1920x1080 stage
     mapped into the .world element (which overhangs 5% for Ken Burns). */
  .world.ledger { background: #F4E6C7 !important; }
  .lp { position: absolute; left: 4.545%; top: 4.545%; width: 90.91%; height: 90.91%; overflow: hidden;
        --lp-cream: #F4E6C7; --lp-char: #25313C; --lp-chalk: #F2F2F2; --lp-acc: #F5B72E; --lp-pos: #178C83; --lp-neg: #ED6A4A; --lp-brand: #1769C2; }
  .lp-page { position: absolute; inset: 0; background: var(--lp-cream); will-change: transform; overflow: hidden; }
  /* plain cream (operator, 2026-09-03: "just a plain cream background"); the newsprint grain stays barely there */
  .lp-grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: multiply; pointer-events: none; }
  /* the unravelling edge: a curl shadow ahead of the front and a lit rim on it */
  .lp-edge { position: absolute; top: 0; bottom: 0; right: -14px; width: 74px;
             background: linear-gradient(90deg, rgba(37,49,60,0) 0%, rgba(37,49,60,.22) 40%, rgba(37,49,60,.42) 62%, rgba(255,255,255,.6) 74%, rgba(37,49,60,.5) 100%); }
  /* the field: the soak is CLIPPED to this rounded box so the ink fills to a definite edge (a stained page, cream margin) */
  /* the field: the scribble or the soak fills the BOARD to a definite edge (clipped, rounded);
     the line then draws exactly on that edge (operator, 2026-09-03: "plain cream, then the scribble/soak, then the line draw") */
  .lp-field { position: absolute; left: 6%; top: 8%; width: 88%; height: 84%; border-radius: 46px; overflow: hidden; }
  .lp-field svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* the clean edge: a conic sector drawn clockwise, hollow centre (outline-draw mechanism),
     on EXACTLY the field's box and radius - the stroke sits on the ink's edge, no gap (E22 addendum 2) */
  .lp-fieldplate { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; }
  /* the DECKLE is the feature (operator, 2026-09-03): when the page spec carries edge_path, the line is drawn ALONG the
     paper's own deckle edge (dash-offset, clockwise) instead of the CSS box, and the charcoal fills the paper up to it */
  .lp-edgeline { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .lp-edgeline path { fill: none; stroke: var(--lp-acc); stroke-width: 5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .lp-outline { position: absolute; left: 6%; top: 8%; width: 88%; height: 84%; --lp-prog: 0; box-sizing: border-box;
                border: 5px solid transparent; border-radius: 46px; pointer-events: none;
                background: conic-gradient(from -90deg, var(--lp-acc) 0deg calc(var(--lp-prog) * 3.6deg), transparent calc(var(--lp-prog) * 3.6deg + .5deg) 360deg);
                background-clip: border-box; background-origin: border-box;
                -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0) border-box; -webkit-mask-composite: xor;
                mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0) border-box; mask-composite: exclude; }
  /* ink writes: per glyph, a left-to-right mask wipe with an ink-soft edge (~18% of the glyph),
     a fixed seeded tilt per character so it reads as a hand and never wriggles after it is written.
     Font: Inter until Human Gate 2 picks the handwriting face (no generic cursive - it resolves per machine). */
  .lp-ink { position: absolute; font-family: Inter, Arial, sans-serif; white-space: nowrap; pointer-events: none; }
  .lp-ink .g { display: inline-block; --w: 0; --tilt: 0deg;
               -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--w) * 118% - 18%), transparent calc(var(--w) * 118%));
               mask-image: linear-gradient(90deg, #000 calc(var(--w) * 118% - 18%), transparent calc(var(--w) * 118%));
               transform: rotate(var(--tilt)); }
  .lp-title { left: 8.4%; top: 10.4%; font-size: 34px; font-weight: 700; color: var(--lp-chalk); letter-spacing: -.01em; }
  .lp-src { left: 6%; bottom: 2.4%; font-size: 22px; font-weight: 500; color: var(--lp-char); }
  .lp-chart { position: absolute; overflow: visible; }
  /* MOTION MENU species (doc 29 s9.27; P35 T6/T7): plate life on the world side, the targeted overlay above the docks */
  #plife { position: absolute; inset: 0; pointer-events: none; }
  #plife img { position: absolute; will-change: transform; transform-origin: 50% 100%; }
  #species { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; overflow: visible; }
  #species .co { fill: none; stroke: #F5B72E; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  #species .sq { fill: none; stroke: #F5B72E; stroke-width: 5; stroke-linecap: round; }
  #species .lab { font: 700 30px Inter, Arial, sans-serif; fill: #F5B72E; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 8px; }   /* inline series names may run past the plot (s9.23b) */
  .lp-chart text { font-family: Inter, Arial, sans-serif; fill: var(--lp-chalk); }
  .lp-chart .ax { stroke: #8a94a0; stroke-width: 2; }
  .lp-chart .grid { stroke: rgba(242,242,242,.14); stroke-width: 1.5; }
  .lp-chart .bar { fill: #9aa4ad; }
  .lp-chart .bar.emph { fill: var(--lp-acc); }
  .lp-chart .val { font-size: 26px; font-weight: 600; fill: #c9ced4; font-variant-numeric: tabular-nums; }
  .lp-chart .lab { font-size: 24px; fill: #c9ced4; }
  .lp-chart .callout { font-size: 30px; font-weight: 700; fill: var(--lp-char); font-variant-numeric: tabular-nums; }
  .lp-chart .cpill { fill: var(--lp-acc); }
  .lp-chart .ser { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .lp-chart .sname { font-size: 24px; font-weight: 700; }

  /* Regional shading, not a global dim. The world half stays fully lit;
     darkening only begins around the midpoint and deepens toward whichever
     side the evidence occupies. --wx is the evidence side (0 = left, 1 =
     right) and --sx/--sy locate the spotlight on the active card. */
  #wash {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    /* The scrim QUIETS the evidence zone; it is not stage lighting. At
       .62 peak every arrival and departure was a lighting event - with
       evidence on screen 80% of runtime, light sloshed at every scene
       (operator, 2026-08-29). The document is opaque cream on a dark
       plate; it needs a whisper, not a blackout. */
    background: linear-gradient(var(--wdir, 90deg),
                rgba(5,19,30,0) 0%, rgba(5,19,30,0) 48%,
                rgba(5,19,30,.18) 70%, rgba(5,19,30,.34) 100%);
    transition: opacity .75s cubic-bezier(.16,1,.3,1);
  }
  #wash.on { opacity: 1; }
  /* spotlight: clear over the card, falling off into the surround */
  #spot {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(58% 62% at var(--sx, 50%) var(--sy, 50%),
                rgba(5,19,30,0) 0%, rgba(5,19,30,0) 50%,
                rgba(5,19,30,.14) 80%, rgba(5,19,30,.24) 100%);
    transition: opacity .75s cubic-bezier(.16,1,.3,1);
  }
  #spot.on { opacity: 1; }

  .dock {
    position: absolute; top: 206px; width: 864px;   /* finance niche: +20% (doc 29 s9.10) */
    background: rgba(244,230,199,.90);
    -webkit-backdrop-filter: blur(3px) saturate(1.06); backdrop-filter: blur(3px) saturate(1.06);
    border: 4px solid var(--charcoal); border-radius: 14px;
    padding: 13px 15px 13px;
    opacity: 0;
    will-change: opacity, transform, clip-path;
  }
  /* ID-scoped: #dock-1's own left rule would otherwise outrank a class chain */
  #dock-1.solo { width: 1056px; top: 172px; }
  #dock-1.solo.side-r { left: 764px; }
  #dock-1.solo.side-l { left: 100px; }
  #dock-1 { left: 64px; } #dock-2 { left: 992px; }

  /* The skill puts mix-blend-mode: multiply on the artblock wrapper — correct
     for hand-drawn INK on a paper canvas. It does not transfer to a literal
     source document: (a) a blend group escapes the white frame and multiplies
     the artwork against the dark world plate behind the translucent dock,
     which renders it near-black; (b) literal evidence must stay literal, and
     multiply tints it. So: no blend here, and isolate the frame so nothing
     downstream can reintroduce one. */
  .slide-frame {
    border: 2px solid var(--charcoal); border-radius: 6px; overflow: hidden;
    background: #fff; isolation: isolate;
  }
  .slide-frame img { display: block; width: 100%; height: auto; }

  /* RECORD DOCUMENT (doc 29 species) — typewriter on paper, one highlighter
     stroke on the exact phrase spoken. Live type, never a static image:
     words appear on the document's clock, the stroke lands per-word on the
     NARRATOR'S word timings. Ported from the motion prototype
     (evidence/prototypes/record-document-motion.html). */
  .dock.record .slide-frame, .dock.record .rail { display: none; }
  /* LIVE CHART (data-document motion pattern): the line is drawn, not
     pasted. Dark chart ground inside the washi frame, like the PNG. */
  .dock.chart .slide-frame img { display: none; }
  .dock.chart .slide-frame { background: #16181c; }
  .chartbox { display: block; width: 100%; height: auto; background: #16181c;
              border-radius: 6px; }
  .chartbox .ct  { font: 800 34px/1.2 "Segoe UI", sans-serif; fill: #f4f6f8; }
  .chartbox .cs  { font: 600 19px/1.3 "Segoe UI", sans-serif; fill: #dce3ea; }
  .chartbox .csr { font: 600 16px/1.3 "Segoe UI", sans-serif; fill: #b8c4d0; }
  .chartbox .cl  { font: 800 26px/1 ui-monospace, Consolas, monospace; }
  .paper { background: #f0eadc; color: #17150f; padding: 34px 42px 30px;
           font-family: "Lucida Sans Typewriter", "Courier New", monospace;
           display: flex; flex-direction: column; min-height: 380px; }
  .paper .phdr { display: flex; justify-content: space-between;
           font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
           color: #6b665c; }
  .paper .prule { height: 2px; background: #cdc5b4; margin: 11px 0 20px; }
  .paper .pkick { font-size: 15px; color: #6b665c; margin-bottom: 12px; }
  .paper blockquote { font-size: 25px; line-height: 1.5; min-height: 5.8em; }
  .paper .hw { background-image: linear-gradient(101deg, transparent 1.5%,
                 rgba(245,201,63,.72) 6%, rgba(245,201,63,.72) 94%,
                 transparent 98.5%);
               background-repeat: no-repeat; background-position: left center;
               background-size: 0% 100%; padding: .06em .04em;
               border-radius: 2px; }
  .paper .pcur { display: inline-block; width: .55em; height: 1em;
                 background: #17150f; vertical-align: -.14em; margin-left: .04em; }
  .paper .pattr { margin-top: auto; font-size: 15px; opacity: 0;
                  transition: opacity .35s ease-out; }
  .paper .psrc { margin-top: 12px; padding-top: 11px;
                 border-top: 2px solid #cdc5b4; font-size: 12px;
                 color: #6b665c; opacity: 0; transition: opacity .35s ease-out; }
  .paper .shown { opacity: 1 !important; }

  .rail { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
  .rail.single { grid-template-columns: 1fr; }
  /* Badges SPRING in: a back-out curve overshoots ~4% and settles. A pure
     decay curve reads as a fade; the small overshoot is what makes the pill
     land like a stamp. */
  /* Sleek ONE-BASELINE pill (doc 29 s9.10.3 - the stacked two-row pill is
     retired): label / value / tag on a single baseline, slim padding, so the
     document fills its own card. The spring stays: back-out overshoot ~4%,
     opacity on a plain decay so only the motion springs, not the ink. */
  .stackbox { position: absolute; inset: 0; perspective: 1400px;
    transform-style: preserve-3d; z-index: 6; pointer-events: none; }
  .stackcard { position: absolute; aspect-ratio: 1056 / 480;
    border-radius: 10px; overflow: hidden; opacity: 0; background: #16181c;
    border: 1px solid #3a3e46; box-shadow: 0 18px 48px rgba(0,0,0,.6);
    will-change: transform, opacity; }
  .stackcard img { width: 100%; height: 100%; object-fit: cover;
    object-position: left top; display: block; }
  /* the stack's host dock is a lifecycle anchor only - no card chrome */
  .dock.stack { visibility: hidden; }
  .pill { background: rgba(37,49,60,.94); border-radius: 7px; padding: 6px 12px;
          display: flex; align-items: baseline; gap: 10px;
          opacity: 0; transform: translateY(15px) scale(.9);
          transition: opacity .34s cubic-bezier(.16,1,.3,1),
                      transform .58s cubic-bezier(.34,1.56,.64,1); }
  .pill.on { opacity: 1; transform: translateY(0) scale(1); }
  .dock.solo .rail { grid-template-columns: 1fr 1fr; }
  .pill-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #c3ceda; white-space: nowrap; }
  /* QC 2026-08-30: a compact value never wraps mid-number ("7 of / 8");
     the row wraps instead, dropping the tag below as a whole chip */
  .pill-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .pill-num { font-size: 23px; font-weight: 800; font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill-tag { font-size: 13px; font-weight: 700; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: rgba(244,230,199,.14); white-space: nowrap; }


  .hand-unused {
    filter: drop-shadow(-12px 16px 20px rgba(0,0,0,.42));
  }

  #seam { position: absolute; top: 0; bottom: 0; width: 6px; background: var(--charcoal); box-shadow: 0 0 22px rgba(5,19,30,.9); opacity: 0; z-index: 45; }
  /* The curtain experiment (2026-08-29) is RETIRED: an opaque panel
     sweeping the stage reads as a blackout blink at every boundary. The
     reviewed mechanism is the cross-reveal below; the light that belongs
     to the outgoing page travels with its front. */

  #caption {
    /* CAPTION SAFE ZONE (operator, 2026-09-02): YouTube's hover controls bar
       overlays roughly the bottom 10-12% of the frame (~110-130px at 1080p)
       in the normal/embedded player - anything there is hidden whenever the
       mouse is on the video, and only fullscreen looks right. Baseline was
       38px (3.5%) and got cut off. 120px = 11.1%, clear of the bar with
       margin; nothing else lives in the bottom band. Doc 29 s9.15 ruling 7. */
    position: absolute; left: 145px; right: 145px; bottom: 120px; text-align: center;
    line-height: 1.24; color: var(--cream); font-size: 40px; font-weight: 700;
    text-shadow: 0 2px 14px rgba(0,0,0,.94), 0 0 5px rgba(0,0,0,.85);
    transition: font-size .3s, font-weight .3s;
  }
  /* doc 29 Part 5 - kinetic groups at ONE fixed anchor. No pill, no panel. */
  #caption .cg { display: inline-block; }
  /* the spoken word takes a subtle pop (remotion-ui EMPHASIS.subtle = 1.05,
     their EASING.pop = our badge spring). Token spaces sit OUTSIDE the
     spans, so the scaled box never closes the gap to its neighbour. */
  #caption .cw { display: inline-block; color: rgba(255,255,255,.80);
                 transform-origin: 50% 88%;
                 transition: color .12s linear,
                             transform .22s cubic-bezier(.34,1.56,.64,1); }
  #caption .cw.on { transform: scale(1.05); }
  #caption.quiet .cw { transform: none !important; }
  #caption .cw.ck { color: #c98500; }        /* keyword accent */
  #caption .cw.on { color: #fff; }           /* the word being spoken now */
  #caption .cw.ck.on { color: #e9a020; }
  /* STAGE mode (doc 29 s9.25 #2, ruling E21; P34 T5): when no dock holds the stage the caption
     IS the motion - centred in the plate's quiet zone, ~64px, each word entering with its own
     explosive pop (scale 1.16 -> 1.0, alternating +-2.5deg tilt settling in ~6 frames), keywords in
     the accent, the spoken word full white. On dock enter it demotes to the anchor (the quiet class)
     inside the dock's 0.75s rise. Declared by the timeline (caption_modes includes "stage"). */
  #caption.stage { bottom: auto; top: 40%; left: 200px; right: 200px; font-size: 64px; font-weight: 800;
                   line-height: 1.12; letter-spacing: -.01em; }
  #caption.stage .cg { transform: none !important; opacity: 1 !important; }
  #caption.stage .cw { opacity: 0; transform: scale(1.16) rotate(var(--tilt, 0deg));
                       transition: transform .2s cubic-bezier(.34,1.56,.64,1), opacity .1s linear, color .12s linear; }
  #caption.stage .cw.in { opacity: 1; transform: scale(1) rotate(0deg); }
  #caption.stage .cw.on { transform: scale(1.06) rotate(0deg); }
  /* 4.2 quiet mode - smaller, static, single fade, keywords still coloured */
  #caption.quiet { font-size: 33px; font-weight: 600; }
  #caption.quiet .cg { transform: none !important; opacity: 1 !important; }

  #bar { width: min(96vw,1400px); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: #0a1620; border: 1px solid #14293a; border-radius: 6px; padding: 10px 13px; }
  button { font: 600 12px/1 Inter, system-ui, sans-serif; letter-spacing: .04em; color: var(--cream);
           background: #10283a; border: 1px solid #1d3d54; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #16344b; }
  button:focus-visible { outline: 2px solid var(--sunflower); outline-offset: 1px; }
  #scrub { flex: 1 1 420px; accent-color: var(--sunflower); }
  /* SOUND REVIEW STRIP - live variant toggles; sound is judged ON the
     timeline, watching (operator ruling 2026-08-31) */
  #sndbar { display: flex; flex-wrap: wrap; gap: 14px; padding: 6px 14px;
    align-items: center; font: 600 12px/1.3 "Segoe UI", sans-serif;
    color: #c3ceda; }
  #sndbar:empty { display: none; }
  .sndcue { display: flex; gap: 6px; align-items: center;
    background: rgba(37,49,60,.7); border-radius: 6px; padding: 4px 9px; }
  .sndcue .lbl { color: #f4e6c7; letter-spacing: .05em;
    text-transform: uppercase; }
  .sndcue button { font: inherit; color: #c3ceda; background: #1b232b;
    border: 1px solid #33363d; border-radius: 4px; padding: 2px 8px;
    cursor: pointer; }
  .sndcue button.on { color: #16181c; background: var(--sunflower);
    border-color: var(--sunflower); }
  .sndcue input[type=range] { width: 64px; accent-color: #3bc9b0; }
  #clock { font: 600 12px/1 ui-monospace, Consolas, monospace; color: #7d95a6; min-width: 108px; text-align: right; font-variant-numeric: tabular-nums; }
  #scenes { width: min(96vw,1400px); display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font: 600 10px/1 ui-monospace, Consolas, monospace; color: #7d95a6; background: #0a1620;
          border: 1px solid #14293a; border-radius: 3px; padding: 5px 7px; cursor: pointer; }
  .chip.on { color: var(--ink); background: var(--sunflower); border-color: var(--sunflower); }
</style>

<h1><b id="eptitle">Episode</b> &middot; scene-evidence lane &middot; <span id="epsub"></span></h1>

<div id="shell"><div id="fit"><div id="stage">
  <div class="world" id="wA"></div>
  <div class="world" id="wB"></div>
  <div id="wash"></div>
  <div id="spot"></div>
  <div id="plife"></div>

  <div class="dock" id="dock-1">
    <div class="slide-frame"><img id="i1" alt="evidence" /></div>
    <div class="rail" id="r1"></div>
  </div>
  <div class="dock" id="dock-2">
    <div class="slide-frame"><img id="i2" alt="evidence" /></div>
    <div class="rail" id="r2"></div>
  </div>

  <div id="seam"></div>
  <svg id="species" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div id="caption"></div>
</div></div></div>

<div id="bar">
  <button id="play">&#9654; Play with narration</button>
  <button id="mute">Mute</button>
  <input id="scrub" type="range" min="0" max="1" step="0.01" value="0" aria-label="timeline scrub" />
  <div id="clock">0:00 / 0:00</div>
</div>
<div id="sndbar"></div>
<div id="scenes"></div>
<audio id="vo" preload="auto"></audio>

<script id="timeline-data" type="application/json">{{TIMELINE}}</script>
<script id="asset-data" type="application/json">{{URIS}}</script>
<script>
(() => {
  "use strict";
  /* $ is declared FIRST. It used to sit below the title/scrub lines that
     call it, so the whole IIFE threw ReferenceError on load and the stage
     rendered black - passing every structural check while showing nothing. */
  const $ = (id) => document.getElementById(id);
  const TL = JSON.parse(document.getElementById("timeline-data").textContent);
  const A  = JSON.parse(document.getElementById("asset-data").textContent);
  /* Runtime comes from the TIMELINE, never hardcoded. A template that
     carries the sample's duration clamps every episode to it. */
  if (TL.title) { document.title = TL.title; $("eptitle").textContent = TL.title;
    $("epsub").textContent = TL.subtitle || ""; }
  const scrub = $("scrub");
  const DUR = TL.runtime_s || (TL.scenes.length ? TL.scenes[TL.scenes.length-1].span[1] : 0);
  scrub.max = DUR;
  const stage = $("stage"), fit = $("fit");
  const fitStage = () => { stage.style.transform = `scale(${fit.clientWidth / 1920})`; };

      const F = st.chkFit, NC = F.headEls.length, PAD = 26;
      const natW = new Array(NC).fill(40);

      const total = alloc.reduce((a, b) => a + b, 0);
      const scale2 = total > F.usable ? F.usable / total : 1;
      const extra = total < F.usable ? (F.usable - total) / NC : 0;

    (st.rowEls || []).forEach((r, ri) => {

      const offs = recap ? [0, 0.25, 0.45, 0.7] : [0, 0.6, 1.0, 1.6];

  /* a wobbled ellipse around a box (hw-callout-circle): seeded, drawn by dash-offset */

  };
  const squigglePath = (b, seed) => {

  const drawOn = (path, k) => { const len = path.getTotalLength ? path.getTotalLength() : 1000; path.setAttribute("stroke-dasharray", len); path.setAttribute("stroke-dashoffset", (len * (1 - spEase(k))).toFixed(1)); };

  const pageFocus = (sc) => {
    const pg = sc.world && sc.world.kind === "ledger" ? sc.world.page : null;
    if (!pg || !pg.focus) return [];

      if (k < 0 || k > 1) return;

        if (sp.label && k * dur > SP.CALLOUT_DRAW * 0.8) {

        const ca = centre(a), cz = centre(z), cx = ca.cx + (cz.cx - ca.cx) * g, cy = ca.cy + (cz.cy - ca.cy) * g;

  const render = (t) => {

      const chartDone = (chartState[s] && chartState[s].doneAt) || 0;

    const quiet = active.length > 0;
    /* STAGE (s9.25 #2): the timeline declares it; the anchor is the shared-stage position only */
    const stage = !quiet && (TL.caption_modes || []).includes("stage");

      let pi = -1;

        ? Math.min(clamp01((t - line.at) / 0.22), clamp01((line.until - t) / 0.18)) : 0;

       never over the emphasized datum); elsewhere it is centred */
    const qz = stage && sc.world.kind === "ledger" && sc.world.page ? sc.world.page.quiet_zone : null;
    cap.style.left = qz === "right" ? "58%" : qz === "left" ? "120px" : "";
    cap.style.right = qz === "left" ? "58%" : qz === "right" ? "120px" : "";

    [...chips.children].forEach((c, i) => c.classList.toggle("on", i === si));
  };

  /* transport — audio is the clock while playing */
  let t = 0, playing = false, raf = 0;
  const clock = $("clock"), playBtn = $("play");
  const fmt = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  /* SOUND ENGINE: cues from TL.sound scheduled on the master clock.
     Each cue owns per-variant <audio> elements built from the embedded
     data URIs; the review strip switches variants LIVE. */
  const SND = (TL.sound || []).map((c) => {
    const els = {};
    for (const [vk, key] of Object.entries(c.variants)) {
      const a = new Audio(A[key]); a.preload = "auto"; els[vk] = a;
    }
    return { ...c, els, sel: Object.keys(c.variants)[0], vol: c.gain };
  });
  const syncSound = (tt, isPlaying) => {
    for (const c of SND) {
      for (const [vk, el] of Object.entries(c.els)) {
        const active = isPlaying && vk === c.sel && c.sel !== "off";
        const dur = el.duration || 0;
        const off = tt - c.at;
        if (active && off >= 0 && dur && off < dur) {
          const fade = c.fade_in > 0 ? Math.min(1, off / c.fade_in) : 1;
          el.volume = Math.min(1, c.vol * fade);
          if (el.paused) { el.currentTime = off; el.play().catch(() => {}); }
          else if (Math.abs(el.currentTime - off) > 0.3) el.currentTime = off;
        } else if (!el.paused) el.pause();
      }
    }
  };
  {
    const bar = document.getElementById("sndbar");
    const fmtC = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
    for (const c of SND) {
      const d = document.createElement("div"); d.className = "sndcue";
      d.innerHTML = `<span class="lbl">${c.slot}</span>`;
      /* jump-to-cue: sound is judged AT its moment - land 2s early so
         the enter is heard in context (operator: "doesn't show me where
         the sounds are actually playing") */
      const j = document.createElement("button");
      j.textContent = "▸ " + fmtC(c.at);
      j.title = "jump to this cue";
      j.addEventListener("click", () => {
        seek(Math.max(0, c.at - 2));
        if (!playing) playBtn.click();
      });
      d.appendChild(j);
      const keys = [...Object.keys(c.els), "off"];
      for (const vk of keys) {
        const b = document.createElement("button");
        b.textContent = vk.toUpperCase();
        if (vk === c.sel) b.classList.add("on");
        b.addEventListener("click", () => {
          c.sel = vk;
          d.querySelectorAll("button").forEach(x => x.classList.remove("on"));
          b.classList.add("on");
          syncSound(t, playing);
        });
        d.appendChild(b);
      }
      const r = document.createElement("input");
      r.type = "range"; r.min = 0; r.max = 1; r.step = 0.05; r.value = c.vol;
      r.addEventListener("input", () => { c.vol = +r.value; });
      d.appendChild(r);
      bar.appendChild(d);
    }
  }
  const sync = () => { scrub.value = t; clock.textContent = `${fmt(t)} / ${fmt(DUR)}`; render(t); syncSound(t, playing); };
  const seek = (v) => { t = Math.min(DUR, Math.max(0, v)); vo.currentTime = t; sync(); };
  const tick = () => {
    if (!playing) return;
    t = Math.min(DUR, vo.currentTime);
    if (t >= DUR) { playing = false; vo.pause(); playBtn.innerHTML = "&#9654; Replay"; }
    sync();
    if (playing) raf = requestAnimationFrame(tick);
  };
  playBtn.addEventListener("click", () => {
    if (playing) { playing = false; vo.pause(); cancelAnimationFrame(raf); playBtn.innerHTML = "&#9654; Play with narration"; syncSound(t, false); }
    else {
      if (t >= DUR) seek(0);
      playing = true; vo.currentTime = t; vo.play().catch(() => {});
      playBtn.textContent = "Pause"; raf = requestAnimationFrame(tick);
    }
  });
  $("mute").addEventListener("click", () => { vo.muted = !vo.muted; $("mute").textContent = vo.muted ? "Unmute" : "Mute"; });
  scrub.addEventListener("input", () => { seek(+scrub.value); });
  sync();
})();

  /* ---- FILMSTRIP MODE (doc 29 s9.16) - true PLAYED frames -----------
     __filmstrip(t0, dur, n, name): for each sample, PLAYS INTO the
     moment (state derives from the live RAF loop), pauses, rasterizes
     a cleaned stage clone (hidden scenes stripped - a raw outerHTML of
     the full stage is ~100MB of data URIs and OOMs the tab), and
     assembles one labeled strip PNG POSTed to :8732. */
  window.__filmstrip = async (t0, dur, n, name) => {
    const g = (id) => document.getElementById(id);
    const stage = g("stage"), vo = g("vo"), scrub = g("scrub"),
          playBtn = g("play");
    const seekTo = (t) => { scrub.value = t;
      scrub.dispatchEvent(new Event("input", { bubbles: true })); };
    const playing = () => playBtn.textContent.includes("Pause");
    const setPlay = (on) => { if (playing() !== on) playBtn.click(); };
    const css = [...document.querySelectorAll("style")]
      .map(x => x.textContent).join(String.fromCharCode(10));
    const FW = 480, FH = Math.round(FW * 9 / 16), PAD = 22;
    const cv = document.createElement("canvas");
    cv.width = FW * n; cv.height = FH + PAD;
    const cx = cv.getContext("2d");
    cx.fillStyle = "#0d0f12"; cx.fillRect(0, 0, cv.width, cv.height);
    for (let i = 0; i < n; i++) {
      const tt = t0 + (i + 0.5) * (dur / n);
      /* visibility-proof: RAF suspends in hidden panes and a MUTED
         audio clock freezes - poll on a timer at whisper volume */
      vo.muted = false; vo.volume = 0.01;
      seekTo(Math.max(0, tt - 0.35));
      setPlay(true);
      await new Promise((res, rej) => {
        const t1 = Date.now();
        const iv = setInterval(() => {
          if (vo.currentTime >= tt) { clearInterval(iv); res(); }
          else if (Date.now() - t1 > 15000) {
            clearInterval(iv); rej(new Error("stall at " + tt)); }
        }, 40);
      });
      setPlay(false);
      seekTo(vo.currentTime);
      const at = vo.currentTime;
      const cl = stage.cloneNode(true);
      cl.querySelectorAll("img").forEach(im => {
        let e = im, vis = true;
        while (e && e !== cl) {
          const st = e.style;
          if (st && (st.opacity === "0" || st.display === "none"))
            vis = false;
          e = e.parentElement;
        }
        const r = im.getBoundingClientRect ? null : null;
        if (!vis) im.removeAttribute("src");
      });
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080">` +
        `<foreignObject width="1920" height="1080">` +
        `<div xmlns="http://www.w3.org/1999/xhtml">` +
        `<style>${css.replace(/]]>/g, "")}</style>` +
        new XMLSerializer().serializeToString(cl) +
        `</div></foreignObject></svg>`;
      /* data: URL, not blob: - this Chromium taints canvases drawn
         from blob-loaded foreignObject SVGs, but not data:-loaded */
      const img = new Image();
      img.src = "data:image/svg+xml;charset=utf-8,"
              + encodeURIComponent(svg);
      await new Promise((res, rej) => {
        img.onload = res; img.onerror = rej; });
      cx.drawImage(img, i * FW, PAD, FW, FH);
      cx.fillStyle = "#dce3ea"; cx.font = "600 13px Consolas, monospace";
      cx.fillText(at.toFixed(2) + "s", i * FW + 8, 15);
      cx.strokeStyle = "#33363d";
      cx.strokeRect(i * FW + 0.5, PAD + 0.5, FW - 1, FH - 1);
    }
    const png = cv.toDataURL("image/png");
    await fetch("http://127.0.0.1:8732/", { method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, png }) });
    return name + ": " + n + " played frames";
  };
</script>
</body></html>
