<meta charset="utf-8"> <!-- served by python http.server with no charset header: without this, caption dashes and ledger ink glyphs decode as cp1252 -->
<title id="doctitle">Episode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"> <!-- the ledger page's hand (HG2: Kalam, OFL) -->
<style>
  :root {
    --charcoal: #25313C; --cobalt: #1769C2; --teal: #178C83;
    --sunflower: #F5B72E; --coral: #ED6A4A; --cream: #F4E6C7;
    /* TEXT TIER - accents lifted for numerals on the charcoal pill. The
       graphic tier above is tuned for lines and chips, where 3:1 passes;
       text needs 4.5:1 and cobalt #1769C2 measures 2.42:1 on the pill -
       unreadable (operator, 2026-08-29). Lifted values measure 5.7-7.4:1. */
    --t-sunflower: #F5B72E; --t-coral: #FF8A70;
    --t-teal: #3BC9B0; --t-cobalt: #8FB3F0;
    --ink: #05131e; --slate: #081824;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #04090e; color: var(--cream);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    gap: 11px; padding: 15px;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #7d95a6; text-align: center; }
  h1 b { color: var(--sunflower); font-weight: 700; }

  #shell { width: min(96vw, 1400px); }
  #fit { position: relative; width: 100%; aspect-ratio: var(--stage-ar); overflow: hidden; border: 1px solid #14293a; border-radius: 6px; background: var(--slate); }
  /* STAGE GEOMETRY (2026-09-03). 16:9 is the default and its numbers are the
     originals, so existing builds render identically. A 9:16 short opts in with
     `data-aspect="9:16"` on <html>, which the timeline's `aspect` field sets. */
  :root { --stage-w: 1920px; --stage-h: 1080px; --stage-ar: 16 / 9; }   /* -ar is unitless: aspect-ratio rejects px */
  html[data-aspect="9:16"] { --stage-w: 1080px; --stage-h: 1920px; --stage-ar: 9 / 16; }
  #stage { position: absolute; inset: 0; width: var(--stage-w); height: var(--stage-h); transform-origin: top left; overflow: hidden; }

  .world { position: absolute; inset: -5%; background-size: cover; background-position: center; will-change: transform, clip-path; }

  /* LEDGER PAGE species (doc 29 s9.26, ruling E22; P35 T3). A world plate
     that IS a chart: the generated page rolls out on the cream ground, the
     charcoal fills the paper to its DECKLE, ink writes the labels, the
     graph builds crisp from the page spec (ledger_page.v1). Every beat is a
     pure function of t (seek-safe, screenshot-render safe); the seeded blobs
     come from lpHash, never Math.random. The .lp box is the 1920x1080 stage
     mapped into the .world element (which overhangs 5% for Ken Burns). */
  .world.ledger { background: #F4E6C7 !important; }
  /* CLIP world (Tokyo, 2026-09-04): a silent generated clip is the world plate. The <video> fills the
     .world element exactly as a background image would; the player SEEKS it to (t - scene start), so a
     frame at t is a pure function of t and the renderer can await the seek (window.__clipsSeeked). */
  .world video.clipv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .lp { position: absolute; left: 4.545%; top: 4.545%; width: 90.91%; height: 90.91%; overflow: hidden;
        --lp-cream: #F4E6C7; --lp-char: #25313C; --lp-chalk: #F2F2F2; --lp-acc: #F5B72E; --lp-pos: #3DDC84; --lp-neg: #FF4D4D;   /* chart SIGN colours (operator, 2026-09-03): green up, red down - the sunflower callout is the only yellow. E67 (2026-09-12) made them electric so a line reads at thumbnail scale [DERIVED: WCAG vs #25313C] pos 7.4:1 (was 3.9), neg 4.1:1 (was 1.9 - invisible) */ --lp-brand: #1769C2; }
  .lp-page { position: absolute; inset: 0; background: var(--lp-cream); will-change: transform; overflow: hidden; }
  /* THE CARD PAGE (operator, 2026-09-08: "keep the edges of the card rounded like this where it's more like a phone ... everything
     should have a shadow instead of a border"): a page declared `card` keeps the thrown card's rounded corners at full size and sits
     on the world with doc 29 s1.2's hard-edge paper shadow (14px 14px 0 ink at 1080p, scaled) and NO border - the world stays visible
     around it (.cardworld). Opt-in per page; a snapped page is a card by default. */
  .lp-page.card { border-radius: 36px; border: 0; box-shadow: 18px 18px 0 #25313C; }   /* operator, 2026-09-08, corrected: NO black frame on a page - "it should just be the very edge of the cream and/or deckle"; the corners stay rounded because when the page is not full-frame (in flight, as a card) its edges are on screen */
  html[data-aspect="9:16"] .lp-page.card { border-radius: 44px; }
  .lp-page.card .lp-field { left: 4.5%; top: 6.5%; width: 91%; height: 87%; }   /* the cream edge a little SMALLER on a card (operator, 2026-09-08: "sorry i meant smaller") */
  .world.ledger.cardworld { background: transparent !important; }
  /* plain cream (operator, 2026-09-03: "just a plain cream background"); the newsprint grain stays barely there */
  .lp-grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: multiply; pointer-events: none; }
  /* the unravelling edge: a curl shadow ahead of the front and a lit rim on it */
  .lp-edge { position: absolute; top: 0; bottom: 0; right: -14px; width: 74px;
             background: linear-gradient(90deg, rgba(37,49,60,0) 0%, rgba(37,49,60,.22) 40%, rgba(37,49,60,.42) 62%, rgba(255,255,255,.6) 74%, rgba(37,49,60,.5) 100%); }
  /* the field: the soak is CLIPPED to this rounded box so the ink fills to a definite edge (a stained page, cream margin) */
  /* the field: the scribble or the soak fills the BOARD to a definite edge (clipped, rounded);
     the line then draws exactly on that edge (operator, 2026-09-03: "plain cream, then the scribble/soak, then the line draw") */
  .lp-field { position: absolute; left: 6%; top: 8%; width: 88%; height: 84%; border-radius: 46px; overflow: hidden; }
  .lp-field svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lp-fieldplate { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; }
  /* E22 addendum 7 (operator, 2026-09-03): NO outline. The deckle IS the edge - the charcoal
     arriving on the cream ground draws it; a drawn line on top pulled no weight. `page.edge_path`
     and the conic border are gone; `page.board` stays (the punch centre and the chart box). */
  /* ink writes: per glyph, a left-to-right mask wipe with an ink-soft edge (~18% of the glyph),
     a fixed seeded tilt per character so it reads as a hand and never wriggles after it is written.
     Font: KALAM (Human Gate 2 DECIDED 2026-09-03 - "Kalam is probably the right call"; SIL OFL), loaded from
     Google Fonts by the link in the head; Inter is the fallback when the machine is offline (never a generic
     cursive - it resolves per machine). */
  .lp-ink { position: absolute; font-family: Kalam, Inter, Arial, sans-serif; white-space: nowrap; pointer-events: none; }
  .lp-ink .g { display: inline-block; --w: 0; --tilt: 0deg;
               -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--w) * 118% - 18%), transparent calc(var(--w) * 118%));
               mask-image: linear-gradient(90deg, #000 calc(var(--w) * 118% - 18%), transparent calc(var(--w) * 118%));
               transform: rotate(var(--tilt)); }
  .lp-title { left: 8.4%; top: 10.4%; font-size: 34px; font-weight: 700; color: var(--lp-chalk); letter-spacing: -.01em; }
  .lp-src { left: 6%; font-size: 22px; font-weight: 500; color: var(--lp-chalk); opacity: .85; }   /* the source sits under the chart box, clear of the anchor caption's band: chalk, not charcoal */
  /* E28: the sub carries the selection rule (which dates and why) - written under the title, wrapped by word */
  .lp-sub { font-size: 21px; font-weight: 400; line-height: 1.25; color: var(--lp-chalk); opacity: .8; white-space: normal; }
  .lp-note { opacity: 1; }   /* a note is the page's own ink at the sub's size, in the quiet zone */
  .world.ledger.snapping { background: transparent !important; }   /* a SNAPPING page grows over the world beneath it: no cream until it covers the stage */
  .page-contact { position: absolute; inset: 4% 3%; border-radius: 28px; pointer-events: none; transform-origin: 50% 62%;
                  background: radial-gradient(ellipse at 50% 60%, rgba(0,0,0,.88) 0%, rgba(0,0,0,.42) 55%, rgba(0,0,0,0) 100%); }   /* the thrown page's contact shadow on the world beneath */
  .lp-sub .w { display: inline-block; white-space: nowrap; }
  /* the page's badge rail: the dock's pill, painted from t (no transition) */
  /* a TIGHT cluster (operator, 2026-09-03: 'tight, sleek grouping that doesn't eat up so much space'): pills sized
     to their content, 6px apart, hugging the chart's left edge under the source - never stretched to the chart */
  .lp-rail { position: absolute; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 6px; pointer-events: none; }
  /* the dock's pill, unchanged in shape and type; only its ground moves to the evidence token so it reads on the
     charcoal board (the dock's charcoal fill vanishes there), with the card's hairline and lift */
  .lp-rail .lp-pill { opacity: 0; transition: none; transform-origin: 0 100%; background: #1B1E23;
                      border: 1px solid #3a3e46; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .lp-chart { position: absolute; overflow: visible; }
  /* MOTION MENU species (doc 29 s9.27; P35 T6/T7): plate life on the world side, the targeted overlay above the docks */
  #plife { position: absolute; inset: 0; pointer-events: none; }
  #plife img { position: absolute; will-change: transform; transform-origin: 50% 100%; }
  .dbro { font: 600 11px Inter, Arial, sans-serif; color: #c9ced4; min-width: 44px; margin-left: 6px; }
  #species, #species-under { position: absolute; inset: 0; width: var(--stage-w); height: var(--stage-h); pointer-events: none; overflow: visible; }
  /* E47 world-change transitions (operator 2026-09-06). Two veils above everything the scene carries, so a
     dip takes the docks, the stage captions and the species down with the world and a blur-zoom softens the
     whole frame. Both are inert until a transition drives them: #dipveil at opacity 0 paints nothing and
     #bzveil at backdrop-filter none filters nothing, so a build with neither exit renders as before. */
  #bzveil { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
  #dipveil { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; z-index: 60; }   /* R26-50: above #caption's z-index 50, because E47's dip takes the viewer's layer down with the world */
#species .co, #species-under .co { fill: none; stroke: #F5B72E; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
#species .sq, #species-under .sq { fill: none; stroke: #F5B72E; stroke-width: 5; stroke-linecap: round; }
#species .lab, #species-under .lab { font: 700 30px Inter, Arial, sans-serif; fill: #F5B72E; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 8px; }   /* inline series names may run past the plot (s9.23b) */
  /* THE ICON CHIP (P50 T2) - the ONE place the module rule lets a species touch the template: its CSS. The card is
     the near-black ink token (--ink #05131e) with a charcoal edge (--charcoal #25313C), the sourced glyph is chalk
     (#F2F2F2) at the set's own stroke-width 2 (the painter's group scale carries it up), the label is the species
     sunflower (#F5B72E) like .lab above, and the X a crossed chip takes reuses .sq - the squiggle's hand. Scoped
     under #species so the chrome's own .chip (the scene strip's control) is untouched. */
#species .chipcard, #species-under .chipcard { fill: #05131e; stroke: #25313C; stroke-width: 3; }
#species .chipglyph, #species-under .chipglyph { fill: none; stroke: #F2F2F2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#species .chiplab, #species-under .chiplab { font: 700 28px Inter, Arial, sans-serif; fill: #F5B72E; text-anchor: middle; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 6px; }
  /* THE FLOW DIAGRAM (P50 T4) - the second place the module rule lets a species touch the template. The frame is
     drawn in the muted ink (#8a94a0, the axis grey) so it reads as a diagram's boundary and never as evidence; the
     arrows are the species sunflower, the same hand as .co and .sq; the year stamp is the frame's own grey, because
     a date is furniture. The cards inside are CHIPS and reuse .chipcard / .chipglyph / .chiplab above. */
#species .flowbox, #species-under .flowbox { fill: none; stroke: #8a94a0; stroke-width: 3; stroke-linecap: round; }
#species .flowarrow, #species-under .flowarrow { fill: none; stroke: #F5B72E; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
#species .flowtag, #species-under .flowtag { font: 700 34px Inter, Arial, sans-serif; fill: #8a94a0; text-anchor: end; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 6px; }
  /* THE VECTOR MAP (P50 T5) - the third place the module rule lets a species touch the template, and the only
     place its colour is written. THE REGISTER IS THE STAGE'S, NOT THE PAGE'S (doc 29 s9.28: a world is the
     stage's ground, species over it): the ground is the slate the player already stands on, the land is the
     near-black ink token with the MUTED INK outline the flow diagram's frame uses (#8a94a0, the axis grey),
     and the FOCUS set - the countries this composition frames - is the charcoal with a CHALK outline, a shade
     stronger. The cream is the ledger PAGE's register and a page is a document; a cream map would fight every
     other world and the caption's chalk type. The outlines keep their width under the fit's scale
     (non-scaling-stroke), so a framed composition is not a thicker map. The light is a FILL in the accent
     (E56: a picture's focus is a light, never a ring), the arc and its X are the species sunflower - the same
     hand as .co, .sq and .flowarrow - and the stamp is that hand's type, sized by the painter (figure | year). */
  .world.vecmap { background: var(--slate) !important; }
  .world svg.vm { position: absolute; left: 4.545%; top: 4.545%; width: 90.91%; height: 90.91%; overflow: visible; }   /* the stage mapped into the .world element, which overhangs 5% - the same box .lp takes */
  .world svg.vm .vmc { fill: var(--ink); stroke: #8a94a0; stroke-width: 1.4; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .world svg.vm .vmfocus { fill: var(--charcoal); stroke: #F2F2F2; stroke-width: 2.2; }
#species .vmlit, #species-under .vmlit { fill: var(--sunflower); stroke: none; }
#species .vmarc, #species-under .vmarc { fill: none; stroke: #F5B72E; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
#species .vmx, #species-under .vmx { fill: none; stroke: #F5B72E; stroke-width: 5; stroke-linecap: round; }
#species .vmstamp, #species-under .vmstamp { font: 700 46px Inter, Arial, sans-serif; fill: #F5B72E; text-anchor: middle; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 7px; }
  /* THE COUNT ARRAY, THE AGENDA AND THE RING'S DASHED FORM (P52 T7/T8) - the module rule's one allowance again:
     a species module may touch the template's CSS and nothing else. The count array's TILE is the tilted plate -
     the near-black ink token with the muted-ink outline the flow diagram's frame uses (#8a94a0), so a field of
     silos reads as a plate and not as N floating icons - its glyph is chalk at the icon set's own stroke-width 2
     (the painter's group scale carries it up), and its CLAIM is the species sunflower, because the count IS the
     claim (E56's own rule about a number: the ring circles one, this one writes it). The agenda's numeral takes
     that same sunflower, its row is chalk type, its sub the frame's grey (a sub is furniture) and its rule the
     grey hairline the nib draws. The dashed ring is the species sunflower at the callout's own width, so the
     dashed form and the hand's circle are visibly the same mark drawn two ways. EVERY SIZE HERE IS SET BY THE
     PAINTER as a font-size attribute (the block scales with its box), so these rules must NOT use the `font`
     shorthand - a CSS shorthand would beat the presentation attribute and pin the type at one size. */
#species .catile, #species-under .catile { fill: #05131e; stroke: #8a94a0; stroke-width: 2.5; stroke-linejoin: round; }
#species .caglyph, #species-under .caglyph { fill: none; stroke: #F2F2F2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#species .caclaim, #species-under .caclaim { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #F5B72E; text-anchor: middle; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 8px; }
#species .agnum, #species-under .agnum { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #F5B72E; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 8px; }
#species .agrow, #species-under .agrow { font-family: Inter, Arial, sans-serif; font-weight: 700; fill: #F2F2F2; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 7px; }
#species .agsub, #species-under .agsub { font-family: Inter, Arial, sans-serif; font-weight: 500; fill: #8a94a0; paint-order: stroke; stroke: rgba(27,30,35,.85); stroke-width: 6px; }
#species .agrule, #species-under .agrule { fill: none; stroke: #8a94a0; stroke-width: 2.5; stroke-linecap: round; }
#species .rngdash, #species-under .rngdash { fill: none; stroke: #F5B72E; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  /* R26-48 (P52 T4): GEOMETRIC PRECISION on every glyph the page writes. The same <text>, the same x/y and the
     same computed type, measured 0.80 px taller in its ink box and ~0.015 px wider on a page that had painted
     many frames than on a fresh one - the hinted advances and ascent Chromium's default `auto` lets Skia pick
     per raster pass. A render arrives cold and a scrub session arrives warm, so the two disagreed on every
     label. `geometricPrecision` takes the outline's own metrics unhinted, which are a function of the font and
     the size alone: the preview's frame and the render's frame become the same frame. */
  .lp text, .lp-chart text { text-rendering: geometricPrecision; }
  .lp-chart text { font-family: Inter, Arial, sans-serif; fill: var(--lp-chalk); }
  .lp-chart .ax { stroke: #8a94a0; stroke-width: 2; }
  .lp-chart .grid { stroke: rgba(242,242,242,.14); stroke-width: 1.5; }
  .lp-chart .bar { fill: #9aa4ad; }
  .lp-chart .bar.neg { fill: var(--lp-neg); }   /* a drop is blood red, a rise green - the sign is colour AND geometry (E28) */
  .lp-chart .bar.pos { fill: var(--lp-pos); }
  /* the emphasized bar KEEPS its sign colour (operator, 2026-09-03: 'that bar should still be red - which is what makes the
     yellow encircling it valuable'); the sunflower is the callout pill and the focus ring only */
  .lp-chart .val { font-size: 26px; font-weight: 600; fill: #c9ced4; font-variant-numeric: tabular-nums; }
  .lp-chart .lab { font-size: 24px; fill: #c9ced4; }
  .lp-chart .callout { font-size: 30px; font-weight: 700; fill: var(--lp-char); font-variant-numeric: tabular-nums; }
  .lp-chart .cpill { fill: var(--lp-acc); }
  .lp-chart .ser { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .lp-chart .sname { font-size: 24px; font-weight: 700; }
  .lp-chart .wedge { stroke: #25313C; stroke-width: 3; stroke-linejoin: round; }
  .lp-chart .wlab { font-family: var(--hand); paint-order: stroke; stroke: rgba(37,49,60,.35); stroke-width: 4px; stroke-linejoin: round; }
  .lp-chart .hrule { stroke-width: 3; stroke-dasharray: 12 9; opacity: .9; }   /* a policy rate is a RULE, not a series (the fifth watch) */
  .lp-chart .bk { fill: none; stroke-width: 3; stroke-linecap: round; }   /* P47 T2: the bracket's span and ticks */
  .lp-morph { pointer-events: none; }   /* P47 T3: the morphing prop, beneath the chart's own svg */
  .dock-contact { position: absolute; height: 18px; border-radius: 50%; background: #141B22; pointer-events: none; opacity: 0; transform-origin: 50% 50%; }   /* HG2: the contact shadow a thrown or landed card casts on its spot; its blur is the depth cue, painted from t (Kersten 1997) */
  .dock.arriving { transform-origin: 50% 100%; }   /* HG2: the hit squashes about the ground contact - the base stays, the top comes down */
  .lp-morph .morph { stroke-linejoin: round; }
  .lp-chart .glow .bk { stroke-width: 7; }
  .lp-chart .bklab, .lp-chart .bksub { font-family: Kalam, Inter, Arial, sans-serif; font-weight: 700; }
  .lp-chart .bksub { font-weight: 400; opacity: .85; }
  .lp-chart .lp-span { stroke: none; }                                                            /* P50 T4: the span's shade - ground under every line, its depth set per frame */
  .lp-chart .spanlab { font-family: Kalam, Inter, Arial, sans-serif; font-weight: 700; }           /* ... and the NAME it gives the stretch, in the same hand the bracket's label is written in */
  .lp-chart .tagchip { font-size: 18px; font-weight: 600; letter-spacing: .04em; opacity: .85; text-transform: lowercase; }
  /* PORTRAIT (P41, doc 49 s49.1 amended 2026-09-05): in 9:16 the chart IS the world. The page fills the frame to
     its deckle, the charcoal fills the page to that edge, the series is re-laid for the tall frame in stage px
     (the chart's viewBox IS its pixel box, so every size below is a stage pixel), and the type clears doc 50's
     floor read for THIS stage: 12 px on a 390 px phone = 34 px on the 1080-wide stage; secondary text sits at
     40 px (14 px on the phone), primary text at >= 59 px (21 px), pill labels at the floor. The punch is skipped:
     it would crop the deckle the page exists to show and push the title into the Shorts top overlay. */
  html[data-aspect="9:16"] .lp-field { border-radius: 30px; }
  html[data-aspect="9:16"] .lp-grain { opacity: .14; }   /* textured cream: the grain reads on a phone only when it is a little louder */
  html[data-aspect="9:16"] .lp-title { font-size: 68px; line-height: 1.12; white-space: normal; }
  html[data-aspect="9:16"] .lp-sub { font-size: 40px; line-height: 1.25; }
  html[data-aspect="9:16"] .lp-src { font-size: 40px; line-height: 1.25; white-space: normal; opacity: .9; }
  .lp-src.compact { font-size: 17px; opacity: .6; letter-spacing: .01em; }   /* the design pass (operator, 2026-09-07): "cited sources should take up minimal space, not maximal" */
  html[data-aspect="9:16"] .lp-src.compact { font-size: 26px; line-height: 1.2; opacity: .6; white-space: nowrap; }
  html[data-aspect="9:16"] .lp-title .w, html[data-aspect="9:16"] .lp-src .w { display: inline-block; white-space: nowrap; }
  html[data-aspect="9:16"] .lp-chart .val { font-size: 59px; }
  html[data-aspect="9:16"] .lp-chart .lab { font-size: 40px; }
  html[data-aspect="9:16"] .lp-chart .callout { font-size: 59px; }
  html[data-aspect="9:16"] .lp-chart .sname { font-size: 44px; }
  html[data-aspect="9:16"] .lp-chart .bk { stroke-width: 5; }
  html[data-aspect="9:16"] .lp-chart .glow .bk { stroke-width: 12; }
  html[data-aspect="9:16"] .lp-chart .tagchip { font-size: 40px; }
  html[data-aspect="9:16"] .lp-chart .ser { stroke-width: 8; }
  .lp-chart .ser.muted { stroke-width: 3; }   /* E67: the history is the series' OWN hue at .45 now, not grey - and thick enough to read as its line */
  html[data-aspect="9:16"] .lp-chart .ser.muted { stroke-width: 6; }
  html[data-aspect="9:16"] .lp-chart .ax { stroke-width: 3; }
  html[data-aspect="9:16"] .lp-chart .grid { stroke-width: 2; }
  html[data-aspect="9:16"] .lp-rail { gap: 12px; }
  html[data-aspect="9:16"] .lp-rail .lp-pill { padding: 8px 18px 10px; border-radius: 12px; flex-direction: column; align-items: flex-start; gap: 0; }   /* label over number: three pills fit one 800px row */
  html[data-aspect="9:16"] .lp-rail .pill-label { font-size: 34px; letter-spacing: .04em; }
  html[data-aspect="9:16"] .lp-rail .pill-num { font-size: 59px; font-family: Inter, Arial, sans-serif; }
  html[data-aspect="9:16"] .lp-rail .pill-tag { display: none; }   /* the tag's clause is the sub's job in portrait: a pill is its label and its number */
  html[data-aspect="9:16"] #caption.stage.onpage { top: auto; bottom: 480px; left: 80px; right: 200px; font-size: 64px; }   /* the caption strip y1340-1440 (G-l), never over the chart or a plate's subject */

  /* Regional shading, not a global dim. The world half stays fully lit;
     darkening only begins around the midpoint and deepens toward whichever
     side the evidence occupies. --wx is the evidence side (0 = left, 1 =
     right) and --sx/--sy locate the spotlight on the active card. */
  #wash {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    /* The scrim QUIETS the evidence zone; it is not stage lighting. At
       .62 peak every arrival and departure was a lighting event - with
       evidence on screen 80% of runtime, light sloshed at every scene
       (operator, 2026-08-29). The document is opaque cream on a dark
       plate; it needs a whisper, not a blackout. */
    background: linear-gradient(var(--wdir, 90deg),
                rgba(5,19,30,0) 0%, rgba(5,19,30,0) 48%,
                rgba(5,19,30,.18) 70%, rgba(5,19,30,.34) 100%);
    transition: opacity .75s cubic-bezier(.16,1,.3,1);
  }
  #wash.on { opacity: 1; }
  /* spotlight: clear over the card, falling off into the surround */
  #spot {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: radial-gradient(58% 62% at var(--sx, 50%) var(--sy, 50%),
                rgba(5,19,30,0) 0%, rgba(5,19,30,0) 50%,
                rgba(5,19,30,.14) 80%, rgba(5,19,30,.24) 100%);
    transition: opacity .75s cubic-bezier(.16,1,.3,1);
  }
  #spot.on { opacity: 1; }

  .dock {
    position: absolute; top: 206px; width: 864px;   /* finance niche: +20% (doc 29 s9.10) */
    background: rgba(244,230,199,.90);
    -webkit-backdrop-filter: blur(3px) saturate(1.06); backdrop-filter: blur(3px) saturate(1.06);
    border: 4px solid var(--charcoal); border-radius: 14px;
    padding: 13px 15px 13px;
    opacity: 0;
    will-change: opacity, transform, clip-path;
  }
  /* ID-scoped: #dock-1's own left rule would otherwise outrank a class chain */
  #dock-1.solo { width: 1056px; top: 172px; }
  #dock-1.solo.side-r { left: 764px; }
  #dock-1.solo.side-l { left: 100px; }
  #dock-1 { left: 64px; } #dock-2 { left: 992px; }

  /* 9:16 — two 864px docks cannot sit side by side in a 1080px frame. They stack:
     full width inside 64px margins, dock-2 under dock-1. Vertical room is what a
     short has instead of horizontal, so the docks get the frame's width and the
     plate keeps the top third for the world. */
  /* THE MOBILE SAFE BOX (doc 49 s49.1 / 50, P37 T0, 2026-09-04): platform chrome covers the
     top 280px, the bottom 480px and the right 200px of a 1080x1920 short, so everything that
     must be read lives in x[80,880] y[280,1340]. Before this the docks were 952px at x=64 -
     136px into the right rail - and the second dock ran to y=1780, under the caption bar.
     At 800px wide a dock is 514px tall (frame 430 + rail 39 + chrome 45); two stack in the
     1060px box with a 12px gap: 280-794 and 806-1320. */
  html[data-aspect="9:16"] .dock { width: 800px; top: 280px; }
  /* ID-scoped for the same reason the 16:9 rules are: #dock-2 { left: 992px }
     outranks any class chain, so the stacked left must be ID-scoped too. */
  html[data-aspect="9:16"] #dock-1 { left: 80px; }
  html[data-aspect="9:16"] #dock-2 { left: 80px; top: 806px; }
  /* a solo card sits in the evidence zone (49 s49.3 zone 2), centred in the box */
  html[data-aspect="9:16"] #dock-1.solo { width: 800px; left: 80px; top: 553px; }
  html[data-aspect="9:16"] #dock-1.solo.side-r,
  html[data-aspect="9:16"] #dock-1.solo.side-l { left: 80px; }
  /* the anchored caption takes the strip under the box, y[1340,1440], not the bottom dead
     zone it inherited from the 16:9 rule (it rendered at y=1759, under the scrub bar).
     E62 (2026-09-11): on a SHORT the quiet anchor's floor is 48px at weight 800 - the operator
     read 33px/600 as the caption "losing its size/punch" (12.1 CSS px on a phone at gate 1; 48px
     is 17 CSS px). It is the fallback now, not the demotion: under a card the caption keeps the
     stage and MOVES (the engine's `caption_band`), and only a card that leaves no band puts it
     here. Two lines at 48px/1.24 are 119px, inside the 150px strip. Left/right take the safe box
     (doc 49 s49.1: the right 200px is platform chrome) - at 33px the inherited 145px margins were
     already in the rail, and bigger type reaches further. The LANDSCAPE quiet size is untouched at
     33px/600: the 16:9 anchor strip is 82px tall (ledger_page.CAPTION_ANCHOR), which is exactly two
     lines at 33px/1.24, and the proportional floor by stage height (48 * 1080/1920 = 27px) is
     already below it - E62 names a floor for the short, and 16:9 is above its own. */
  html[data-aspect="9:16"] #caption.quiet { bottom: 480px; left: 80px; right: 200px; font-size: 48px; font-weight: 800; }

  /* The skill puts mix-blend-mode: multiply on the artblock wrapper — correct
     for hand-drawn INK on a paper canvas. It does not transfer to a literal
     source document: (a) a blend group escapes the white frame and multiplies
     the artwork against the dark world plate behind the translucent dock,
     which renders it near-black; (b) literal evidence must stay literal, and
     multiply tints it. So: no blend here, and isolate the frame so nothing
     downstream can reintroduce one. */
  .slide-frame {
    border: 2px solid var(--charcoal); border-radius: 6px; overflow: hidden;
    background: #fff; isolation: isolate;
  }
  .slide-frame img { display: block; width: 100%; height: auto; }
  /* VIDEO DOCK (ruling E44 / R26-7, 2026-09-06): the dock's asset is a clip, so the card carries
     moving pictures instead of a still. The frame takes the card's own 16:9 rectangle (a still
     sizes the frame from its intrinsic height; a video has none until metadata lands, and a card
     that resizes mid-hold is a second motion nobody authored) and the clip COVERS it. */
  .dock.video .slide-frame { aspect-ratio: 16 / 9; background: #16181c; }
  .dock.video .slide-frame img { display: none; }
  .slide-frame video.clipv { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

  /* RECORD DOCUMENT (doc 29 species) — typewriter on paper, one highlighter
     stroke on the exact phrase spoken. Live type, never a static image:
     words appear on the document's clock, the stroke lands per-word on the
     NARRATOR'S word timings. Ported from the motion prototype
     (evidence/prototypes/record-document-motion.html). */
  .dock.record .slide-frame, .dock.record .rail { display: none; }
  /* THE PRESS CARD (P50 T3; doc 29 s9.27 "Push hand-off"; Bravos shots 5-10). A headline cut from a screenshot
     (press_card.py), docked as paper: the still card's frame, no badge rail, and a MASTHEAD STRIP along the card's
     TOP edge carrying the source line in the record document's header type - the same family, tracking and ink as
     .paper .phdr above, so the attribution reads as print and never as UI. The strip is at the top because the pile
     fans UPWARD: every older card shows its masthead over the newer one in front of it.
     Nothing here animates. The stack's whole pose is one transform the dock loop writes per frame from
     species/press.mjs (pressStack), about the card's bottom centre - the hinge the pile grows off. */
  /* the pile's own box: the solo card's width, centred on the stage, in the evidence zone. It is ID-free on purpose
     (a press card mounts as #press-<slide>, so the #dock-1 / #dock-2 left rules never reach it) and it is the ONLY
     placement a press dock has - the stack is a shape, not a layout, and everything else about it is the transform. */
  .dock.press { width: 1056px; left: 432px; top: 330px; transform-origin: 50% 100%; }
  html[data-aspect="9:16"] .dock.press { width: 800px; left: 80px; top: 660px; }   /* the mobile safe box x[80,880] (doc 49 s49.1) */
  .dock.press .rail { display: none; }
  .dock.press .pmast { display: flex; justify-content: space-between; gap: 14px; padding: 0 2px 9px;
    font-family: "Lucida Sans Typewriter", "Courier New", monospace; font-size: 13px; letter-spacing: .16em;
    text-transform: uppercase; color: #6b665c; }
  /* portrait: the same strip at the record paper's portrait size - 13px on a phone is not a source line, it is a smudge */
  html[data-aspect="9:16"] .dock.press .pmast { font-size: 22px; letter-spacing: .12em; padding-bottom: 12px; }
  /* LIVE CHART (data-document motion pattern): the line is drawn, not
     pasted. Dark chart ground inside the washi frame, like the PNG. */
  .dock.chart .slide-frame img { display: none; }
  .dock.chart .slide-frame { background: #16181c; }
  /* A CHART CARD thrown onto a plate (the card a page later snaps up from): not a dock in a player frame (Tokyo's docks keep
     theirs) - "the corners have to be rounded, but the black frame should not be in play, it should just be the very edge of
     the cream" (operator, 2026-09-08). The rendered card already carries its cream margin, so the dock's own frame, padding
     and ground come off; the landing's contact shadow is its weight. */
  .dock.chart.card-page { border: 0; padding: 0; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-radius: 44px; overflow: hidden; }
  .dock.chart.card-page .slide-frame { background: transparent; border-radius: 44px; overflow: hidden; }
  .chartbox { display: block; width: 100%; height: auto; background: #16181c;
              border-radius: 6px; }
  .chartbox .ct  { font: 800 34px/1.2 "Segoe UI", sans-serif; fill: #f4f6f8; }
  .chartbox .cs  { font: 600 19px/1.3 "Segoe UI", sans-serif; fill: #dce3ea; }
  .chartbox .csr { font: 600 16px/1.3 "Segoe UI", sans-serif; fill: #b8c4d0; }
  .chartbox .cl  { font: 800 26px/1 ui-monospace, Consolas, monospace; }
  .paper { background: #f0eadc; color: #17150f; padding: 34px 42px 30px;
           font-family: "Lucida Sans Typewriter", "Courier New", monospace;
           display: flex; flex-direction: column; min-height: 380px; }
  .paper .phdr { display: flex; justify-content: space-between;
           font-size: 13px; letter-spacing: .16em; text-transform: uppercase;

  /* portrait (2026-09-10, the Tokyo pledge record): the paper's type was sized for a 1920-wide stage - on a phone 25px is
     unreadable; the 9:16 record reads at the sub's size, its chrome a step under */
  html[data-aspect="9:16"] .paper { padding: 26px 34px 24px; min-height: 0; }
  html[data-aspect="9:16"] .paper blockquote { font-size: 32px; line-height: 1.4; min-height: 4.2em; }

  html[data-aspect="9:16"] .paper .pattr { font-size: 18px; }
  /* the paper's height is its typed text: on a phone the source line grew the foot under the caption strip (measured 36 px);
     the header IS the citation (E52) and the source path lives in the META, so the line is off in portrait */
  html[data-aspect="9:16"] .paper .psrc { display: none; }
  /* the record is a SCALABLE object (the operator, 2026-09-10: "pop the card centered exactly as it is, and move it and resize it to
     that slot"): its type is set in container-query units of the dock's width, so the park - a layout width - resizes the paper
     without a rewrap: the lines the viewer read stay the lines. At the 626 px band card these equal the px sizes above. */
  html[data-aspect="9:16"] .dock.record { container-type: inline-size; }
  html[data-aspect="9:16"] .dock.record .paper { padding: 4.2cqw 5.4cqw 3.8cqw; }
  html[data-aspect="9:16"] .dock.record .paper blockquote { font-size: 5.1cqw; }
  html[data-aspect="9:16"] .dock.record .paper .phdr { font-size: 2.9cqw; }
  html[data-aspect="9:16"] .dock.record .paper .pkick { font-size: 3.2cqw; }
  html[data-aspect="9:16"] .dock.record .paper .pattr { font-size: 2.9cqw; }
  html[data-aspect="9:16"] .dock.record .paper .prule { margin: 1.8cqw 0 3.2cqw; }
  .paper .hw { background-image: linear-gradient(101deg, transparent 1.5%,
                 rgba(245,201,63,.72) 6%, rgba(245,201,63,.72) 94%,
                 transparent 98.5%);
               background-repeat: no-repeat; background-position: left center;
               background-size: 0% 100%; padding: .06em .04em;
               border-radius: 2px; }
  .paper .pcur { display: inline-block; width: .55em; height: 1em;
                 background: #17150f; vertical-align: -.14em; margin-left: .04em; }
  .paper .pattr { margin-top: auto; font-size: 15px; opacity: 0;
                  transition: opacity .35s ease-out; }
  .paper .psrc { margin-top: 12px; padding-top: 11px;
                 border-top: 2px solid #cdc5b4; font-size: 12px;
                 color: #6b665c; opacity: 0; transition: opacity .35s ease-out; }

  .rail { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
  .rail.single { grid-template-columns: 1fr; }
  /* Badges SPRING in: a back-out curve overshoots ~4% and settles. A pure
     decay curve reads as a fade; the small overshoot is what makes the pill
     land like a stamp. */
  /* Sleek ONE-BASELINE pill (doc 29 s9.10.3 - the stacked two-row pill is
     retired): label / value / tag on a single baseline, slim padding, so the
     document fills its own card. The spring stays: back-out overshoot ~4%,
     opacity on a plain decay so only the motion springs, not the ink. */
  .stackbox { position: absolute; inset: 0; perspective: 1400px;
    transform-style: preserve-3d; z-index: 6; pointer-events: none; }
  .stackcard { position: absolute; aspect-ratio: 1056 / 480;
    border-radius: 10px; overflow: hidden; opacity: 0; background: #16181c;
    border: 1px solid #3a3e46; box-shadow: 0 18px 48px rgba(0,0,0,.6);
    will-change: transform, opacity; }
  .stackcard img { width: 100%; height: 100%; object-fit: cover;
    object-position: left top; display: block; }
  /* the stack's host dock is a lifecycle anchor only - no card chrome */
  .dock.stack { visibility: hidden; }
  .pill { background: rgba(37,49,60,.94); border-radius: 7px; padding: 6px 12px;
          display: flex; align-items: baseline; gap: 10px;
          opacity: 0; transform: translateY(15px) scale(.9);
          transition: opacity .34s cubic-bezier(.16,1,.3,1),
                      transform .58s cubic-bezier(.34,1.56,.64,1); }
  .pill.on { opacity: 1; transform: translateY(0) scale(1); }
  .dock.solo .rail { grid-template-columns: 1fr 1fr; }
  .pill-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #c3ceda; white-space: nowrap; }
  /* QC 2026-08-30: a compact value never wraps mid-number ("7 of / 8");
     the row wraps instead, dropping the tag below as a whole chip */
  .pill-row { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .pill-num { font-size: 23px; font-weight: 800; font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill-tag { font-size: 13px; font-weight: 700; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: rgba(244,230,199,.14); white-space: nowrap; }


  .hand-unused {
    filter: drop-shadow(-12px 16px 20px rgba(0,0,0,.42));

  /* HF-17 (P50 T15) - THE FOREGROUND LAYER. A world plate may declare a cutout that belongs IN FRONT of
     everything that lands on it; a dock that names it (`behind: "<layer>"`) is occluded by it. Occlusion is
     the depth cue, not blur (the intake's HF-17 against doc 29's open focus-rack proposal; the operator has
     preferred the wash to a rack since 2026-09-06). It carries the WORLD's own transform, because it is part
     of the plate - the Ken Burns, the idle and the camera move it with the ground it stands on - and it sits
     above the docks and below #species and #caption: the card goes behind the object, the annotation and the
     viewer's own layer never do (E59: Z5 is the viewer's layer). */
  #fgover { position: absolute; inset: -5%; background-size: cover; background-position: center;
            opacity: 0; pointer-events: none; z-index: 7; will-change: transform, opacity; }
  #seam { position: absolute; top: 0; bottom: 0; width: 6px; background: var(--charcoal); box-shadow: 0 0 22px rgba(5,19,30,.9); opacity: 0; z-index: 45; }
  /* The curtain experiment (2026-08-29) is RETIRED: an opaque panel
     sweeping the stage reads as a blackout blink at every boundary. The
     reviewed mechanism is the cross-reveal below; the light that belongs
     to the outgoing page travels with its front. */

  #caption {
    /* CAPTION SAFE ZONE (operator, 2026-09-02): YouTube's hover controls bar
       overlays roughly the bottom 10-12% of the frame (~110-130px at 1080p)
       in the normal/embedded player - anything there is hidden whenever the
       mouse is on the video, and only fullscreen looks right. Baseline was
       38px (3.5%) and got cut off. 120px = 11.1%, clear of the bar with
       margin; nothing else lives in the bottom band. Doc 29 s9.15 ruling 7. */
    position: absolute; left: 145px; right: 145px; bottom: 120px; text-align: center;
    line-height: 1.24; color: var(--cream); font-size: 40px; font-weight: 700;
    /* Z5 - THE VIEWER'S LAYER (E21, E59; R26-50). The caption never dims and nothing the world
       does paints over it: not a mounting page's cream, not a transition plate raised above the
       incoming world, not the plate's foreground cutout (#fgover, whose own comment has said so
       since HF-17) and not the wipe's seam. Only E47's two veils sit higher (z-index 60), because
       a dip through black takes the whole frame, captions included. Before this the caption was
       z-index auto and the outgoing world, raised to 3 while a page mounted, painted over it -
       the caption 'dimmed with the page' the operator read at 1:01 of the Tokyo cut. */
    z-index: 50;
    text-shadow: 0 2px 14px rgba(0,0,0,.94), 0 0 5px rgba(0,0,0,.85);
    /* no transition: the stage -> anchor demote is instant so a seek-and-screenshot render and a
       live play agree on every frame (a wall-clock transition never lands in a captured frame) */
  }
  /* doc 29 Part 5 - kinetic groups at ONE fixed anchor. No pill, no panel. */
  #caption .cg { display: inline-block; }
  /* the spoken word takes a subtle pop (remotion-ui EMPHASIS.subtle = 1.05,
     their EASING.pop = our badge spring). Token spaces sit OUTSIDE the
     spans, so the scaled box never closes the gap to its neighbour. */
  #caption .cw { display: inline-block; color: rgba(255,255,255,.80);
                 transform-origin: 50% 88%;
                 transition: color .12s linear,
                             transform .22s cubic-bezier(.34,1.56,.64,1); }
  #caption .cw.on { transform: scale(1.05); }
  #caption.quiet .cw { transform: none !important; }
  #caption .cw.ck { color: #c98500; }        /* keyword accent */
  #caption .cw.on { color: #fff; }           /* the word being spoken now */
  #caption .cw.ck.on { color: #e9a020; }
  /* STAGE mode (doc 29 s9.25 #2, ruling E21; P34 T5): when no dock holds the stage the caption
     IS the motion - centred in the plate's quiet zone, ~64px, each word entering with its own
     explosive pop (scale 1.16 -> 1.0, alternating +-2.5deg tilt settling in ~6 frames), keywords in
     the accent, the spoken word full white. On dock enter it demotes to the anchor (the quiet class)
     inside the dock's 0.75s rise. Declared by the timeline (caption_modes includes "stage"). */
  #caption.stage { bottom: auto; top: 40%; left: 200px; right: 200px; font-size: 64px; font-weight: 800;
                   line-height: 1.12; letter-spacing: -.01em; }
  #caption.stage .cg { transform: none !important; opacity: 1 !important; }
  /* the per-word pop is painted INLINE as a pure function of t (stagePop below) - never a CSS
     transition, which runs on wall time: the renderer scrubs then screenshots, so a transition
     is either already over or not started in every captured frame, and two renders of one
     second differ. Only the colour flip stays a transition (it is not motion). */
  #caption.stage .cw { transition: color .12s linear; }
  /* 4.2 quiet mode - smaller, static, single fade, keywords still coloured */
  #caption.quiet { font-size: 33px; font-weight: 600; }
  #caption.quiet .cg { transform: none !important; opacity: 1 !important; }
  /* PHRASE (shorts, 2026-09-05): the line is read, not chased - every word legible from the page's start, the spoken-word
     flip retired; only a keyword is punctuated (it re-pops and brightens when spoken, and stays) */
  #caption.phrase .cw { color: rgba(255,255,255,.92); padding: 0 .14em; margin: 0 -.02em; border-radius: .14em;
                        background-repeat: no-repeat; background-position: left center;
                        text-shadow: 0 2px 10px rgba(0,0,0,.55), 0 4px 22px rgba(0,0,0,.3); }   /* contrast from the text itself (the reference) */
  /* a KEYWORD keeps its GOLD whatever sits behind it (operator, 2026-09-05: 'the box should go on it, but it shouldn't change
     the gold'): solid accent, a fifth larger (hyperframes caption-editorial-emphasis), and it FLARES with a glow when spoken
     (caption-neon-glow) - the glow painted inline as a function of t */
  #caption.phrase .cw.ck { font-size: 1.2em; color: #F5B72E; }
  #caption.phrase .cw.ck.on { color: #F5B72E; }
  /* THE BLEND (2026-09-05, after four rounds): the phrase lands as one and flashes gold; only a keyword moves with the voice -
     it pops larger and takes the red box as punctuation, staying gold on it (hyperframes caption-highlight + editorial-emphasis
     folded into the golden set's spring) */
  #caption.phrase .cw.lit { color: #fff; }
  #caption.phrase .cw.ck.lit { color: #F5B72E; }

    border-color: var(--sunflower); }
  .sndcue input[type=range] { width: 64px; accent-color: #3bc9b0; }
  #clock { font: 600 12px/1 ui-monospace, Consolas, monospace; color: #7d95a6; min-width: 108px; text-align: right; font-variant-numeric: tabular-nums; }
  #scenes { width: min(96vw,1400px); display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font: 600 10px/1 ui-monospace, Consolas, monospace; color: #7d95a6; background: #0a1620;
          border: 1px solid #14293a; border-radius: 3px; padding: 5px 7px; cursor: pointer; }
  .chip.on { color: var(--ink); background: var(--sunflower); border-color: var(--sunflower); }

  /* THE LAYER SWITCH (R26-13 / P52 T15) - `?layers=page,docks,captions` (any subset) paints ONLY the
     layers named, so measure_frozen_frames.py can hash one layer at a time and M18 can read the PAGE
     on its own. E49's whole-frame hash cannot see a frozen page beneath a boiling caption (Tokyo v2:
     1036 distinct frames of 1066, M18 PASS, the pages still).

     Three layers, from the DOM below: PAGE is the world and everything painted with it (the two
     `.world` plates, the wash, the spotlight, the plate-life images, the foreground cutout, the seam,
     BOTH species overlays - a species annotates the page, E49 s3 - and the two veils, which take the
     whole world down); DOCKS are the evidence cards (`.dock`, and the stack board `.stackbox` the
     engine appends to the stage); CAPTIONS is `#caption`, the viewer's layer (Z5, E21/E59).

     `visibility`, not `display` or `opacity`, and `!important`: the engine writes inline opacity,
     transforms and `style.visibility` on these elements every frame (an author `!important` still
     wins over an inline declaration), and a hidden layer must keep its GEOMETRY so the layers that
     stay are painted exactly where the whole frame paints them.

     OFF by default: with no `?layers=` in the URL no attribute is set and no rule below matches, so a
     build's player.html renders byte-identically (the goldens prove it). The switch is a query read
     at load - never a build-time write. */
  html[data-layers]:not([data-layers~="page"]) .world,
  html[data-layers]:not([data-layers~="page"]) #wash,
  html[data-layers]:not([data-layers~="page"]) #spot,
  html[data-layers]:not([data-layers~="page"]) #plife,
  html[data-layers]:not([data-layers~="page"]) #fgover,
  html[data-layers]:not([data-layers~="page"]) #seam,
  html[data-layers]:not([data-layers~="page"]) #species,
  html[data-layers]:not([data-layers~="page"]) #species-under,
  html[data-layers]:not([data-layers~="page"]) #bzveil,
  html[data-layers]:not([data-layers~="page"]) #dipveil,
  html[data-layers]:not([data-layers~="docks"]) .dock,
  html[data-layers]:not([data-layers~="docks"]) .stackbox,
  html[data-layers]:not([data-layers~="captions"]) #caption { visibility: hidden !important; }
</style>

<script>
  /* THE LAYER SWITCH, read from the URL BEFORE the first paint (R26-13 / P52 T15). The shell owns it
     because the runtime is a module since P51 T1: the attribute is set on <html> here, the CSS above
     does the hiding, and the engine is untouched - nothing is removed from the DOM, so every layer
     still lives, animates and measures as it does in the whole frame. An unknown name is dropped;
     `?layers=` with nothing known left (`?layers=none`) hides all three, which is a legal question. */
  (function () {
    var want = new URLSearchParams(location.search).get("layers");
    if (want === null) return;                                  /* off by default - no attribute, no rule */
    var KNOWN = ["page", "docks", "captions"];
    var on = want.split(/[,\s]+/).map(function (s) { return s.trim().toLowerCase(); })
                 .filter(function (s) { return KNOWN.indexOf(s) >= 0; });
    document.documentElement.setAttribute("data-layers", on.join(" "));
  })();
</script>
