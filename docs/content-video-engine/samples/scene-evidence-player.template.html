<title>Current Bubble v4</title>
<style>
  :root {
    --charcoal: #25313C; --cobalt: #1769C2; --teal: #178C83;
    --sunflower: #F5B72E; --coral: #ED6A4A; --cream: #F4E6C7;
    --ink: #05131e; --slate: #081824;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #04090e; color: var(--cream);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    gap: 11px; padding: 15px;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: #7d95a6; text-align: center; }
  h1 b { color: var(--sunflower); font-weight: 700; }

  #shell { width: min(96vw, 1400px); }
  #fit { position: relative; width: 100%; aspect-ratio: 16/9; overflow: hidden; border: 1px solid #14293a; border-radius: 6px; background: var(--slate); }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; transform-origin: top left; overflow: hidden; }

  .world { position: absolute; inset: -5%; background-size: cover; background-position: center; will-change: transform, clip-path; }

  #wash {
    position: absolute; inset: 0; opacity: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(5,19,30,0) 6%, rgba(5,19,30,.20) 20%,
                rgba(5,19,30,.34) 52%, rgba(5,19,30,.30) 78%, rgba(5,19,30,.46) 100%);
    transition: opacity .5s cubic-bezier(.16,1,.3,1);
  }
  #wash.on { opacity: 1; }

  .dock {
    position: absolute; top: 226px; width: 720px;
    background: rgba(244,230,199,.90);
    -webkit-backdrop-filter: blur(3px) saturate(1.06); backdrop-filter: blur(3px) saturate(1.06);
    border: 4px solid var(--charcoal); border-radius: 14px;
    box-shadow: 12px 12px 0 rgba(37,49,60,.82);
    padding: 13px 15px 13px;
    opacity: 0;
    will-change: opacity, transform, clip-path;
  }
  .dock.solo { width: 940px; left: 490px; top: 196px; }
  #dock-1 { left: 136px; } #dock-2 { left: 1064px; }

  .dock-head { margin-bottom: 9px; }
  .dock-title { font-size: 25px; font-weight: 800; color: var(--charcoal); line-height: 1.12; }
  /* The skill puts mix-blend-mode: multiply on the artblock wrapper — correct
     for hand-drawn INK on a paper canvas. It does not transfer to a literal
     source document: (a) a blend group escapes the white frame and multiplies
     the artwork against the dark world plate behind the translucent dock,
     which renders it near-black; (b) literal evidence must stay literal, and
     multiply tints it. So: no blend here, and isolate the frame so nothing
     downstream can reintroduce one. */
  .slide-frame {
    border: 2px solid var(--charcoal); border-radius: 6px; overflow: hidden;
    background: #fff; isolation: isolate;
  }
  .artwrap { display: block; }
  .artwrap svg { display: block; width: 100%; height: auto; }

  .rail { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 11px; }
  .rail.single { grid-template-columns: 1fr; }
  .pill { background: rgba(37,49,60,.94); border-radius: 7px; padding: 8px 11px; display: flex; flex-direction: column;
          opacity: 0; transform: translateY(13px);
          transition: opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1); }
  .pill.on { opacity: 1; transform: none; }
  .dock.solo .rail { grid-template-columns: 1fr 1fr; }
  .pill-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: #9fb4c4; }
  .pill-row { display: flex; align-items: baseline; gap: 9px; margin-top: 3px; }
  .pill-num { font-size: 29px; font-weight: 800; font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .pill-tag { font-size: 13px; font-weight: 700; letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: rgba(244,230,199,.14); }


  /* near life-size: ~56% of frame height including forearm, so the sleeve
     plausibly reaches in from off-frame. transform-origin sits on the nib so
     jitter pivots around the pen tip. */
  .hand {
    position: absolute; height: 604px; width: auto; pointer-events: none;
    opacity: 0; visibility: hidden; z-index: 40;
    transform-origin: 28.7% 88.6%;
    filter: drop-shadow(-12px 16px 20px rgba(0,0,0,.42));
  }

  #seam { position: absolute; top: 0; bottom: 0; width: 6px; background: var(--charcoal); box-shadow: 0 0 22px rgba(5,19,30,.9); opacity: 0; }

  #caption {
    position: absolute; left: 145px; right: 145px; bottom: 38px; text-align: center;
    line-height: 1.24; color: var(--cream);
    text-shadow: 0 2px 14px rgba(0,0,0,.94), 0 0 5px rgba(0,0,0,.85);
  }

  #bar { width: min(96vw,1400px); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         background: #0a1620; border: 1px solid #14293a; border-radius: 6px; padding: 10px 13px; }
  button { font: 600 12px/1 Inter, system-ui, sans-serif; letter-spacing: .04em; color: var(--cream);
           background: #10283a; border: 1px solid #1d3d54; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #16344b; }
  button:focus-visible { outline: 2px solid var(--sunflower); outline-offset: 1px; }
  #scrub { flex: 1 1 420px; accent-color: var(--sunflower); }
  #clock { font: 600 12px/1 ui-monospace, Consolas, monospace; color: #7d95a6; min-width: 108px; text-align: right; font-variant-numeric: tabular-nums; }
  #scenes { width: min(96vw,1400px); display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font: 600 10px/1 ui-monospace, Consolas, monospace; color: #7d95a6; background: #0a1620;
          border: 1px solid #14293a; border-radius: 3px; padding: 5px 7px; cursor: pointer; }
  .chip.on { color: var(--ink); background: var(--sunflower); border-color: var(--sunflower); }
</style>

<h1><b>Current Bubble &mdash; five minute v4</b> &middot; scene-evidence lane &middot; generated from timeline.v4.json</h1>

<div id="shell"><div id="fit"><div id="stage">
  <div class="world" id="wA"></div>
  <div class="world" id="wB"></div>
  <div id="wash"></div>

  <div class="dock" id="dock-1">
    <div class="dock-head"><span class="dock-title" id="t1"></span></div>
    <div class="slide-frame"><div class="artwrap"><svg id="sv1" viewBox="0 0 1376 768"><defs><mask id="mk1" maskUnits="userSpaceOnUse" x="-80" y="-80" width="1536" height="928"><rect x="-80" y="-80" width="1536" height="928" fill="black"></rect><path id="pth1" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="130"></path></mask></defs><image id="i1" x="0" y="0" width="1376" height="768" mask="url(#mk1)" preserveAspectRatio="xMidYMid slice"></image></svg></div></div>
    <div class="rail" id="r1"></div>
  </div>
  <div class="dock" id="dock-2">
    <div class="dock-head"><span class="dock-title" id="t2"></span></div>
    <div class="slide-frame"><div class="artwrap"><svg id="sv2" viewBox="0 0 1376 768"><defs><mask id="mk2" maskUnits="userSpaceOnUse" x="-80" y="-80" width="1536" height="928"><rect x="-80" y="-80" width="1536" height="928" fill="black"></rect><path id="pth2" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="130"></path></mask></defs><image id="i2" x="0" y="0" width="1376" height="768" mask="url(#mk2)" preserveAspectRatio="xMidYMid slice"></image></svg></div></div>
    <div class="rail" id="r2"></div>
  </div>

  <img class="hand" id="handA" alt="" />
  <img class="hand" id="handB" alt="" />
  <div id="seam"></div>
  <div id="caption"></div>
</div></div></div>

<div id="bar">
  <button id="play">&#9654; Play with narration</button>
  <button id="mute">Mute</button>
  <input id="scrub" type="range" min="0" max="300" step="0.01" value="0" aria-label="timeline scrub" />
  <div id="clock">0:00 / 5:00</div>
</div>
<div id="scenes"></div>
<audio id="vo" preload="auto"></audio>

<script id="timeline-data" type="application/json">{{TIMELINE}}</script>
<script id="asset-data" type="application/json">{{URIS}}</script>
<script>
(() => {
  "use strict";
  const TL = JSON.parse(document.getElementById("timeline-data").textContent);
  const A  = JSON.parse(document.getElementById("asset-data").textContent);
  const DUR = 300;
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), fit = $("fit");
  const fitStage = () => { stage.style.transform = `scale(${fit.clientWidth / 1920})`; };
  addEventListener("resize", fitStage); fitStage();

  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const io = (k) => k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
  const ACCENT = { sunflower: "var(--sunflower)", coral: "var(--coral)", teal: "var(--teal)", cobalt: "var(--cobalt)" };

  const vo = $("vo"); vo.src = A["__audio__"];
  const wA = $("wA"), wB = $("wB"), wash = $("wash"), seam = $("seam"), cap = $("caption");
  const docks = [$("dock-1"), $("dock-2")];
  const WIPE = 0.9;

  const REVEAL = 1.35, EXIT = 0.55, CARD_IN = 0.3;
  const handA = $("handA"), handB = $("handB");
  handA.src = A["__handA__"] || ""; handB.src = A["__handB__"] || "";
  const NIB = { x: 0.287, y: 0.886 };   // measured on the cutout

  /* Serpentine reveal path. Rows are stroke CENTERLINES inset by sw/2 so the
     painted coverage (body + round caps) lands exactly inside the rect, and
     the row step stays <= stroke width or thin unrevealed stripes cross the
     art. The rect overshoots the image into blank space on every side. */
  const serp = (x0, y0, x1, y1, rows, sw) => {
    const ix0 = x0 + sw / 2, ix1 = x1 - sw / 2, iy0 = y0 + sw / 2, iy1 = y1 - sw / 2;
    const step = (iy1 - iy0) / Math.max(1, rows - 1);
    let d = "M" + ix0 + " " + Math.round(iy0);
    for (let i = 0; i < rows; i++) {
      d += " H" + (i % 2 === 0 ? ix1 : ix0);
      if (i < rows - 1) d += " V" + Math.round(iy0 + step * (i + 1));
    }
    return d;
  };
  const PATHS = {};
  for (const n of ["1", "2"]) {
    const el = document.getElementById("pth" + n);
    el.setAttribute("d", serp(-80, -80, 1456, 848, 8, 130));
    PATHS[n] = { el: el, len: 0 };
  }
  const hideHands = () => {
    for (const h of [handA, handB]) { h.style.opacity = 0; h.style.visibility = "hidden"; }
  };

  /* every dock carries its own lifetime: enter -> hand-led reveal -> hold
     (7s cap) -> exit. Nothing lives to the end of a scene. */
  const DOCKS = [];
  TL.scenes.forEach((sc, si) => (sc.docks || []).forEach((d) => DOCKS.push({ ...d, si, scene: sc })));

  const chips = $("scenes");
  TL.scenes.forEach((sc, i) => {
    const c = document.createElement("button");
    c.className = "chip"; c.textContent = `${sc.scene_id} ${sc.span[0].toFixed(0)}s`;
    c.addEventListener("click", () => seek(sc.span[0] + 0.05));
    chips.appendChild(c);
  });

  const fillDock = (slot, aid) => {
    const ev = TL.evidence[aid]; if (!ev) return;
    const n = slot + 1;
    $("t" + n).textContent = ev.title;
    $("i" + n).setAttribute("href", A[aid] || "");
    const rail = $("r" + n); rail.innerHTML = "";
    rail.classList.toggle("single", ev.badges.length === 1);
    ev.badges.forEach((bd, bi) => {
      const el = document.createElement("div");
      el.className = "pill"; el.id = `p${n}${bi}`;
      el.innerHTML = `<span class="pill-label">${bd.label}</span><span class="pill-row">` +
        `<span class="pill-num" style="color:${ACCENT[bd.accent] || "var(--sunflower)"}">${bd.value}</span>` +
        `<span class="pill-tag" style="color:${ACCENT[bd.accent] || "var(--sunflower)"}">${bd.tag}</span></span>`;
      rail.appendChild(el);
    });
  };

  let shown = ["", ""];
  const render = (t) => {
    let si = 0;
    for (let i = 0; i < TL.scenes.length; i++) if (t >= TL.scenes[i].span[0]) si = i;
    const sc = TL.scenes[si];

    /* LAYER 1 — one continuous ken-burns per scene; incoming world wipes in */
    /* camera LOCKS while a document is being drawn: a travelling canvas
       during a reveal breaks the drawn-on-paper illusion */
    const drawing = (TL.scenes[si].docks || []).find((d) => t >= d.enter && t < d.enter + REVEAL);
    const camT = drawing ? drawing.enter : t;
    const paint = (el, scene) => {
      el.style.backgroundImage = `url("${A[scene.world.asset_id]}")`;
      const kb = scene.world.ken_burns;
      const p = clamp01((camT - scene.span[0]) / Math.max(0.1, scene.span[1] - scene.span[0]));
      el.style.transform = `scale(${(1 + p*kb.scale).toFixed(4)}) translate(${(p*kb.x).toFixed(1)}px, ${(p*kb.y).toFixed(1)}px)`;
    };
    const prev = TL.scenes[si - 1];
    paint(wA, prev || sc);
    paint(wB, sc);
    const wk = prev ? io(clamp01((t - sc.span[0]) / WIPE)) : 1;
    const dir = sc.exit === "wipe_right" ? "0 0 0 " : "0 ";
    wB.style.clipPath = sc.exit === "wipe_right"
      ? `inset(0 0 0 ${(1-wk)*100}%)` : `inset(0 ${(1-wk)*100}% 0 0)`;
    const seaming = prev && wk > 0 && wk < 1;
    seam.style.opacity = seaming ? 1 : 0;
    seam.style.transform = `translateX(${(sc.exit === "wipe_right" ? (1-wk) : wk) * 1920}px)`;

    /* LAYER 2/3 — docks live on their own schedule */
    const live = DOCKS.filter((d) => t >= d.enter && t < d.exit + EXIT);
    wash.classList.toggle("on", live.length > 0);
    let handSet = false;

    for (let s = 0; s < 2; s++) {
      const d = live.find((x) => x.slot === s);
      const el = docks[s];
      if (!d) { el.style.opacity = 0; el.style.clipPath = "inset(0 100% 0 0)"; continue; }
      if (d.slide !== shown[s]) { fillDock(s, d.slide); shown[s] = d.slide; }
      el.classList.toggle("solo", live.length === 1 && s === 0);

      const rk = clamp01((t - d.enter - CARD_IN) / REVEAL);      /* mask sweep */
      const xk = t > d.exit ? clamp01((t - d.exit) / EXIT) : 0;  /* clean exit */
      /* clear the hidden-state clip: the SVG mask owns the reveal now, and a
         leftover inset() from the empty branch keeps the dock at zero width */
      el.style.clipPath = "none";
      /* the sheet is placed first, then drawn on: a short micro-scale card
         entrance, and the mask sweep starts once the card has landed */
      const ck = clamp01((t - d.enter) / CARD_IN);
      el.style.opacity = (1 - xk) * ck;
      el.style.transform = xk
        ? "translateY(" + (-14 * xk) + "px) scale(" + (1 - 0.04 * xk) + ")"
        : "scale(" + (0.94 + 0.06 * io(ck)) + ")";

      /* reveal = stroke-dashoffset on the mask path, linear (ease "none") */
      const P = PATHS[String(s + 1)];
      if (!P.len) P.len = (P.el.getTotalLength() || 9000) * 1.02;
      P.el.style.strokeDasharray = String(P.len);
      P.el.style.strokeDashoffset = String(P.len * (1 - rk));

      /* the hand rides the mask tip and exists IFF a stroke is in progress */
      if (rk > 0 && rk < 1 && !handSet) {
        handSet = true;
        const L = P.el.getTotalLength();
        const dpos = Math.min(L, rk * L);
        const pt = P.el.getPointAtLength(dpos);
        const ahead = P.el.getPointAtLength(Math.min(L, dpos + 3));
        const back = (ahead.x - pt.x) < -0.5;   /* right-to-left row -> B pose */
        const active = back ? handB : handA, idle = back ? handA : handB;
        idle.style.opacity = 0; idle.style.visibility = "hidden";

        const sv = document.getElementById("sv" + (s + 1)).getBoundingClientRect();
        const f = fit.getBoundingClientRect(), k = fit.clientWidth / 1920;
        const ax = (sv.left - f.left) / k, ay = (sv.top - f.top) / k;
        const kx = (sv.width / k) / 1376, ky = (sv.height / k) / 768;
        const hw = active.naturalWidth && active.naturalHeight
          ? 604 * active.naturalWidth / active.naturalHeight : 320;
        const jitter = Math.sin(rk * 34) * 2.2;   /* hand wobble, never canvas */
        active.style.visibility = "visible";
        active.style.opacity = Math.min(1, rk * 8, (1 - rk) * 8);
        active.style.left = (ax + pt.x * kx - hw * NIB.x) + "px";
        active.style.top = (ay + pt.y * ky - 604 * NIB.y) + "px";
        active.style.transform = "rotate(" + jitter + "deg)";
      }

      const badges = (TL.evidence[d.slide] || {}).badges || [];
      badges.forEach((_, bi) => {
        const pill = document.getElementById(`p${s+1}${bi}`);
        const at = (d.badge_at || [])[bi];
        if (pill) pill.classList.toggle("on", at != null && t >= at && t < d.exit);
      });
    }
    if (!handSet) hideHands();
    const active = live;

    /* LAYER 5 — canonical caption track: resolved by time at its own
       timings, never resampled onto beat boundaries (doc 29 Part 5). */
    let line = null;
    for (const c of TL.captions) { if (t >= c.at && t < c.until) { line = c; break; } }
    cap.textContent = line ? line.text : "";
    const quiet = active.length > 0;
    cap.style.fontSize = quiet ? "33px" : "40px";
    cap.style.fontWeight = quiet ? "600" : "700";
    cap.style.opacity = line
      ? Math.min(clamp01((t - line.at) / 0.22), clamp01((line.until - t) / 0.18))
      : 0;

    [...chips.children].forEach((c, i) => c.classList.toggle("on", i === si));
  };

  /* transport — audio is the clock while playing */
  let t = 0, playing = false, raf = 0;
  const scrub = $("scrub"), clock = $("clock"), playBtn = $("play");
  const fmt = (s) => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  const sync = () => { scrub.value = t; clock.textContent = `${fmt(t)} / 5:00`; render(t); };
  const seek = (v) => { t = Math.min(DUR, Math.max(0, v)); vo.currentTime = t; sync(); };
  const tick = () => {
    if (!playing) return;
    t = Math.min(DUR, vo.currentTime);
    if (t >= DUR) { playing = false; vo.pause(); playBtn.innerHTML = "&#9654; Replay"; }
    sync();
    if (playing) raf = requestAnimationFrame(tick);
  };
  playBtn.addEventListener("click", () => {
    if (playing) { playing = false; vo.pause(); cancelAnimationFrame(raf); playBtn.innerHTML = "&#9654; Play with narration"; }
    else {
      if (t >= DUR) seek(0);
      playing = true; vo.currentTime = t; vo.play().catch(() => {});
      playBtn.textContent = "Pause"; raf = requestAnimationFrame(tick);
    }
  });
  $("mute").addEventListener("click", () => { vo.muted = !vo.muted; $("mute").textContent = vo.muted ? "Unmute" : "Mute"; });
  scrub.addEventListener("input", () => { seek(+scrub.value); });
  sync();
})();
</script>
