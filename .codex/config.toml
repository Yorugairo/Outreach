#:schema https://developers.openai.com/codex/config-schema.json

# Repository-local Codex routing. Global MCP servers remain user-level.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 1

[agents.speedster]
description = "Quick-cast Spark worker for deterministic, low-reasoning microtasks."
config_file = "agents/speedster.toml"

[agents.implementation_luna]
description = "Bounded Luna implementation worker for well-defined moderate features and fixes."
config_file = "agents/implementation_luna.toml"

[agents.architect_sol]
description = "Lead Sol architect for repository research and implementation-ready PRP drafts."
config_file = "agents/architect_sol.toml"

[agents.release_steward]
description = "Mechanical Luna steward for reviewed commits and explicitly authorized pushes."
config_file = "agents/release_steward.toml"

