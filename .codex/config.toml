#:schema https://developers.openai.com/codex/config-schema.json

# Repository-local Codex routing. Global MCP servers remain user-level.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"

[features]
multi_agent = true

[agents]
max_threads = 4
max_depth = 1

[agents.speedster]
description = "Quick-cast Spark worker for deterministic, low-reasoning microtasks."
config_file = "agents/speedster.toml"

[agents.junior_developer]
description = "Spark-max junior developer for bounded implementation, scoped fixes, and small explicit writes."
config_file = "agents/junior_developer.toml"

[agents.implementation_luna]
description = "Luna-max implementation worker for well-defined moderate features and fixes."
config_file = "agents/implementation_luna.toml"

[agents.architect_sol]
description = "Lead Sol architect for repository research and implementation-ready PRP drafts."
config_file = "agents/architect_sol.toml"

[agents.release_steward]
description = "Spark-high Git steward for reviewed commits and explicitly authorized pushes."
config_file = "agents/release_steward.toml"

[agents.explorer]
description = "Spark-max read-only codebase explorer for evidence gathering."
config_file = "agents/explorer.toml"

[agents.docs_researcher]
description = "Spark-max read-only documentation researcher for primary-source verification."
config_file = "agents/docs_researcher.toml"

[agents.reviewer]
description = "Spark-max read-only reviewer for correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

