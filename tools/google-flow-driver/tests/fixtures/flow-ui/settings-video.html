<!doctype html>
<main data-flow-root="project" data-flow-project="true" data-flow-project-id="project-001" data-flow-account-verified="true" aria-label="Flow project">
  <button data-flow-settings-trigger aria-label="Generation settings"></button>
  <section data-flow-settings-menu data-state="open" role="dialog" aria-label="Generation settings">
    <button data-flow-control="mode" data-value="video">Video</button>
    <button data-flow-control="model" data-value="Veo 3">Veo 3</button>
    <button data-flow-control="ratio" data-value="9:16">9:16</button>
    <button data-flow-control="duration" data-value="8s">8s</button>
    <button data-flow-control="quantity" data-value="2">2</button>
  </section>
  <div data-flow-prompt-editor data-flow-prompt data-slate-editor="true" contenteditable="true">A slow camera push toward the lantern.</div>
  <section data-flow-references role="group" aria-label="References"><div data-flow-reference></div></section>
  <div data-flow-credit data-cost="4">4 credits</div>
  <button data-flow-submit data-flow-action="submit" aria-label="Create">Create</button>
</main>
