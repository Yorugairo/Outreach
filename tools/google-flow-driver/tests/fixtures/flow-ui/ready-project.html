<!doctype html>
<main data-flow-root="project" data-flow-project="true" data-flow-project-id="project-001" data-flow-account-verified="true" aria-label="Flow project">
  <button data-flow-settings-trigger aria-label="Generation settings" aria-expanded="true"></button>
  <section data-flow-settings-menu data-state="open" role="dialog" aria-label="Generation settings">
    <button data-flow-control="mode" data-value="image" role="button">Image</button>
    <button data-flow-control="model" data-value="Nano Banana Pro 2" role="button">Nano Banana Pro 2</button>
    <button data-flow-control="ratio" data-value="16:9" role="button">16:9</button>
    <button data-flow-control="duration" data-value="4s" role="button">4s</button>
    <button data-flow-control="quantity" data-value="3" role="button">3</button>
  </section>
  <div data-flow-prompt-editor data-flow-prompt data-slate-editor="true" contenteditable="true" aria-label="Prompt">A bridge over a quiet river at dawn.</div>
  <section data-flow-references role="group" aria-label="References">
    <div data-flow-reference data-reference-id="ref-a"></div>
    <div data-flow-reference data-reference-id="ref-b"></div>
  </section>
  <div data-flow-credit data-cost="0">0 credits</div>
  <button data-flow-submit data-flow-action="submit" aria-label="Create">Create</button>
  <section data-flow-media-grid aria-label="Generated media">
    <article data-flow-media-item data-flow-media-id="existing-001" data-status="settled"><img data-media-url="https://cdn.example/existing-001.png" /></article>
  </section>
</main>
