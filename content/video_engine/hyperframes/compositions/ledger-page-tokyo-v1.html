<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* TOKYO TEA BREAK - LEDGER PAGE v1 (9:16 Vertical 1080x1920)
         Data: US 10Y (+5.0%), FX Hedge Drag (-5.5%), Net Hedged Return (-0.5% / -50 bps)
         Timing (13.0s):
           0.0s - 0.7s: Roll-out washi cream ground (#F4E6C7)
           0.7s - 1.5s: Savor empty textured paper
           1.5s - 3.9s: Charcoal ink bleed (#25313C)
           3.9s - 4.4s: Punch-in 1.16x into board
           4.4s - 7.4s: Bars build from zero baseline
           7.4s - 13.0s: Focus callout landing on -50 bps pill
      */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1B1E23; font-family: Inter, -apple-system, sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* Page Ground */
      .page-frame { position: absolute; inset: 0; overflow: hidden; }
      .page { position: absolute; inset: 0; background: #F4E6C7; transform-origin: 50% 50%; will-change: transform; }
      .grain { position: absolute; inset: 0; opacity: 0.22; mix-blend-mode: multiply; pointer-events: none; }
      .roll-edge {
        position: absolute; top: 0; bottom: 0; right: -8px; width: 48px; will-change: opacity;
        background: linear-gradient(90deg, rgba(37,49,60,0) 0%, rgba(37,49,60,0.28) 35%, rgba(255,255,255,0.6) 60%, rgba(37,49,60,0.35) 100%);
      }

      /* Inked Charcoal Board */
      .board {
        position: absolute; left: 60px; top: 120px; width: 960px; height: 1680px;
        background: #25313C; border-radius: 28px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.35);
        overflow: hidden; opacity: 0;
      }
      .board-deckle {
        position: absolute; inset: 12px; border: 2px dashed rgba(242, 242, 242, 0.25);
        border-radius: 20px; pointer-events: none;
      }

      /* Header Typography */
      .header { position: absolute; left: 100px; top: 170px; width: 880px; opacity: 0; }
      .tag { font-size: 24px; font-weight: 700; letter-spacing: 0.12em; color: #F5B72E; text-transform: uppercase; margin-bottom: 12px; }
      .title { font-size: 52px; font-weight: 800; line-height: 1.15; color: #F2F2F2; letter-spacing: -0.02em; margin-bottom: 16px; }
      .sub { font-size: 28px; font-weight: 500; line-height: 1.35; color: #C9CED4; }

      /* Chart Container */
      .chart-container {
        position: absolute; left: 80px; top: 580px; width: 920px; height: 860px; opacity: 0;
      }
      svg.chart-svg { width: 100%; height: 100%; overflow: visible; }

      /* Chart SVG Styling */
      .zero-axis { stroke: #8A94A0; stroke-width: 3; stroke-linecap: round; }
      .grid-line { stroke: rgba(138, 148, 160, 0.2); stroke-width: 1.5; stroke-dasharray: 6 6; }
      .axis-label { fill: #8A94A0; font-size: 22px; font-family: ui-monospace, "SF Mono", monospace; }
      .bar-label { fill: #F2F2F2; font-size: 26px; font-weight: 600; text-anchor: middle; }
      .bar-val { font-size: 32px; font-weight: 700; font-family: ui-monospace, "SF Mono", monospace; text-anchor: middle; }

      /* Accent Callout Pill */
      .callout-pill {
        position: absolute;
        background: #E05A47;
        color: #FFFFFF;
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 32px;
        font-weight: 800;
        box-shadow: 0 8px 24px rgba(224, 90, 71, 0.45);
        opacity: 0;
        transform: scale(0.85);
        pointer-events: none;
      }

      /* Badges Rail */
      .badge-rail {
        position: absolute; left: 100px; bottom: 180px; width: 880px;
        display: flex; gap: 20px; justify-content: space-between; opacity: 0;
      }
      .badge {
        flex: 1; background: rgba(16, 22, 31, 0.65); border: 1.5px solid #8A94A0;
        border-radius: 16px; padding: 18px 20px;
      }
      .badge.active { border-color: #E05A47; background: rgba(224, 90, 71, 0.12); }
      .b-label { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; color: #8A94A0; text-transform: uppercase; margin-bottom: 6px; }
      .b-val { font-size: 36px; font-weight: 800; font-family: ui-monospace, monospace; }
      .b-tag { font-size: 18px; font-weight: 600; margin-top: 4px; }

      /* Source Footnote */
      .source {
        position: absolute; left: 100px; bottom: 135px;
        font-size: 20px; font-weight: 500; color: #8A94A0; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="ledger-page-tokyo-v1" data-start="0" data-duration="13.0" data-width="1080" data-height="1920" data-fps="30">
      <!-- Beat 1: Washi Page Frame -->
      <div class="page-frame" id="page-frame">
        <div class="page" id="page">
          <svg class="grain" width="100%" height="100%" aria-hidden="true">
            <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0 0.10  0 0 0 0.35 0"/></filter>
            <rect width="100%" height="100%" filter="url(#paper)"/>
          </svg>
          <div class="roll-edge" id="roll-edge"></div>
        </div>
      </div>

      <!-- Beat 3: Charcoal Inked Board -->
      <div class="board" id="board">
        <div class="board-deckle"></div>

        <!-- Header -->
        <div class="header" id="header">
          <div class="tag">The Anchor Math</div>
          <div class="title">The Trade Broke on a Single Calculation</div>
          <div class="sub">US 10Y Yield minus 3-month USD/JPY FX Hedge Cost (Annualized)</div>
        </div>

        <!-- Chart -->
        <div class="chart-container" id="chart-container">
          <svg class="chart-svg" viewBox="0 0 920 860">
            <!-- Grid Lines -->
            <line class="grid-line" x1="120" y1="160" x2="860" y2="160" />
            <text class="axis-label" x="100" y="168" text-anchor="end">+6%</text>

            <line class="grid-line" x1="120" y1="310" x2="860" y2="310" />
            <text class="axis-label" x="100" y="318" text-anchor="end">+3%</text>

            <!-- Zero Axis -->
            <line class="zero-axis" x1="100" y1="460" x2="880" y2="460" />
            <text class="axis-label" x="85" y="468" text-anchor="end" font-weight="bold" fill="#F2F2F2">0%</text>

            <line class="grid-line" x1="120" y1="610" x2="860" y2="610" />
            <text class="axis-label" x="100" y="618" text-anchor="end">-3%</text>

            <line class="grid-line" x1="120" y1="760" x2="860" y2="760" />
            <text class="axis-label" x="100" y="768" text-anchor="end">-6%</text>

            <!-- Bars -->
            <!-- Bar 1: US 10Y (+5.0%) -> Y goes from 460 down to 210 (height 250) -->
            <g class="bar-group" id="bar-group-1">
              <rect id="bar-1" x="180" y="210" width="160" height="250" rx="12" fill="#1769C2" style="transform-origin: 260px 460px; transform: scaleY(0);" />
              <text class="bar-label" x="260" y="500">US 10Y Yield</text>
              <text class="bar-val" id="val-1" x="260" y="180" fill="#61A8FF" opacity="0">+5.0%</text>
            </g>

            <!-- Bar 2: FX Hedge Drag (-5.5%) -> Y goes from 460 down to 735 (height 275) -->
            <g class="bar-group" id="bar-group-2">
              <rect id="bar-2" x="400" y="460" width="160" height="275" rx="12" fill="#D13438" style="transform-origin: 480px 460px; transform: scaleY(0);" />
              <text class="bar-label" x="480" y="430">FX Hedge Drag</text>
              <text class="bar-val" id="val-2" x="480" y="780" fill="#FF7B80" opacity="0">-5.5%</text>
            </g>

            <!-- Bar 3: Net Return (-0.5%) -> Y goes from 460 down to 485 (height 25) -->
            <g class="bar-group" id="bar-group-3">
              <rect id="bar-3" x="620" y="460" width="160" height="40" rx="8" fill="#E05A47" style="transform-origin: 700px 460px; transform: scaleY(0);" />
              <text class="bar-label" x="700" y="430" fill="#E05A47" font-weight="700">Net Hedged</text>
              <text class="bar-val" id="val-3" x="700" y="540" fill="#E05A47" opacity="0">-0.5%</text>
            </g>
          </svg>
        </div>

        <!-- The Focus Callout Pill over Bar 3 -->
        <div class="callout-pill" id="callout-pill" style="left: 650px; top: 1140px;">
          -50 bps
        </div>

        <!-- Badges Rail -->
        <div class="badge-rail" id="badge-rail">
          <div class="badge">
            <div class="b-label">US 10Y YIELD</div>
            <div class="b-val" style="color: #61A8FF;">+5.0%</div>
            <div class="b-tag" style="color: #61A8FF;">Headline</div>
          </div>
          <div class="badge">
            <div class="b-label">FX HEDGE COST</div>
            <div class="b-val" style="color: #FF7B80;">-5.5%</div>
            <div class="b-tag" style="color: #FF7B80;">Currency Swap</div>
          </div>
          <div class="badge active" id="badge-active">
            <div class="b-label" style="color: #E05A47;">NET TOKYO CARRY</div>
            <div class="b-val" style="color: #E05A47;">-50 bps</div>
            <div class="b-tag" style="color: #E05A47;">Underwater Trade</div>
          </div>
        </div>

        <!-- Source Footnote -->
        <div class="source" id="source">
          Source: Bloomberg / Bank of Japan / US Treasury data
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var tl = gsap.timeline({ paused: true });

        var page = document.getElementById("page");
        var edge = document.getElementById("roll-edge");
        var board = document.getElementById("board");
        var header = document.getElementById("header");
        var chart = document.getElementById("chart-container");
        var pill = document.getElementById("callout-pill");
        var rail = document.getElementById("badge-rail");
        var source = document.getElementById("source");

        var bar1 = document.getElementById("bar-1");
        var bar2 = document.getElementById("bar-2");
        var bar3 = document.getElementById("bar-3");
        var val1 = document.getElementById("val-1");
        var val2 = document.getElementById("val-2");
        var val3 = document.getElementById("val-3");

        // 1. Roll-out: 0.0s - 0.7s
        gsap.set(page, { xPercent: -100 });
        gsap.set(edge, { opacity: 1 });
        tl.to(page, { xPercent: 0, duration: 0.7, ease: "power3.out" }, 0.0);
        tl.to(edge, { opacity: 0, duration: 0.25, ease: "power2.out" }, 0.7);

        // 2. Savor hold: 0.7s - 1.5s (textured cream held empty)

        // 3. Ink Bleed: 1.5s - 3.9s (Charcoal board reveals)
        tl.to(board, { opacity: 1, duration: 2.4, ease: "power2.inOut" }, 1.5);
        tl.to(header, { opacity: 1, y: 0, duration: 1.0, ease: "power2.out" }, 3.0);
        tl.to(source, { opacity: 0.8, duration: 0.8, ease: "power2.out" }, 3.5);

        // 4. Punch In: 3.9s - 4.4s (1.16x zoom on board center)
        tl.to(board, { scale: 1.04, duration: 0.5, ease: "power2.out" }, 3.9);

        // 5. Chart Builds: 4.4s - 7.4s
        tl.to(chart, { opacity: 1, duration: 0.4 }, 4.4);

        // Bar 1: US 10Y rises (4.6s - 5.4s)
        tl.to(bar1, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 4.6);
        tl.to(val1, { opacity: 1, y: 0, duration: 0.4 }, 5.0);

        // Bar 2: FX Hedge drops down (5.4s - 6.2s)
        tl.to(bar2, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 5.4);
        tl.to(val2, { opacity: 1, y: 0, duration: 0.4 }, 5.8);

        // Bar 3: Net Return hangs below zero (6.2s - 7.0s)
        tl.to(bar3, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 6.2);
        tl.to(val3, { opacity: 1, duration: 0.4 }, 6.6);

        // Badges pop in
        tl.to(rail, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 6.8);

        // 6. Focus Callout Landing: 7.4s - 13.0s
        // -50 bps pill springs in and pulses once, holding through narration
        tl.to(pill, { opacity: 1, scale: 1.0, duration: 0.5, ease: "back.out(1.7)" }, 7.4);
        tl.to(pill, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.inOut" }, 7.9);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["ledger-page-tokyo-v1"] = tl;
      })();
    </script>
  </body>
</html>
