<!doctype html><html><head><meta charset="utf-8">
<title>Money Physics banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap">
<style>
  html,body { margin:0; padding:0; background:#F4E6C7; }
  #stage { width:2560px; height:1440px; position:relative; overflow:hidden; background:#F4E6C7;
            font-family:Inter,Arial,sans-serif; transform:scale(0.5); transform-origin:top left; }
  .grain { position:absolute; inset:0; opacity:.05;
            background-image:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 4px); }
  .inner { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            text-align:center; z-index:5; }
  .name { font-weight:800; font-size:44px; letter-spacing:.42em; color:#25313C;
           margin-bottom:30px; }
  .name b { color:#1769C2; }
  .triad { white-space:nowrap; font-weight:900; font-size:118px; color:#25313C;
            letter-spacing:-0.01em; }
  .triad .chip { background:#1769C2; color:#F4E6C7; padding:0 32px; }
  .tag { margin-top:34px; font-weight:700; font-size:36px; color:#178C83; letter-spacing:.06em; }
</style></head><body>
<div id="stage"><div class="grain"></div><div style="position:absolute;left:507px;top:508px;width:1546px;height:423px;outline:2px dashed rgba(37,49,60,.35);z-index:9;pointer-events:none;"></div>
  <div class="inner">
    <div class="name">MONEY <b>PHYSICS</b></div>
    <div class="triad">Risk. <span class="chip">Reward.</span> Time.</div>
    <div class="tag">The market isn't magic. It's <b style="color:#ED6A4A">mechanics</b>.</div>
  </div>
</div></body></html>
