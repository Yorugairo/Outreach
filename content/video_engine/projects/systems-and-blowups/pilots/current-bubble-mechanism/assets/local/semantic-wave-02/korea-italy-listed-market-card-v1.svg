<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="420" viewBox="0 0 1920 420" role="img" aria-label="Korea and Milan listed-market capitalization comparison card">
  <rect width="1920" height="420" rx="34" fill="#071a2c"/>
  <rect x="38" y="38" width="12" height="344" rx="6" fill="#18a7ad"/>
  <text x="86" y="96" fill="#f6e4be" font-family="Arial, sans-serif" font-size="35" font-weight="700" letter-spacing="3">LISTED-MARKET CAPITALIZATION · NOT GDP</text>
  <text x="86" y="143" fill="#95d4d2" font-family="Arial, sans-serif" font-size="23">Recent snapshots converted to EUR · Korea Exchange / ECB / Borsa Italiana</text>
  <g font-family="Arial, sans-serif">
    <text x="88" y="217" fill="#dce9e6" font-size="28">Korea Exchange</text>
    <rect x="88" y="243" width="1070" height="58" rx="29" fill="#d1a25a"/>
    <text x="1182" y="287" fill="#f6e4be" font-size="47" font-weight="700">≈ EUR 3.2T</text>
    <text x="88" y="347" fill="#dce9e6" font-size="28">Milan market</text>
    <rect x="88" y="365" width="387" height="24" rx="12" fill="#6d9aa0"/>
    <text x="506" y="389" fill="#f6e4be" font-size="37" font-weight="700">≈ EUR 1.16T</text>
  </g>
  <text x="1395" y="242" fill="#b7c6c8" font-family="Arial, sans-serif" font-size="22">As of July 2026</text>
  <text x="1210" y="291" fill="#b7c6c8" font-family="Arial, sans-serif" font-size="21">KRX ≈ EUR 3.21T from KRW 5,370T ÷ 1,674.31 KRW/EUR</text>
  <text x="1210" y="331" fill="#b7c6c8" font-family="Arial, sans-serif" font-size="21">Milan: EUR 1,157.8B reported at the beginning of July</text>
  <text x="1210" y="371" fill="#b7c6c8" font-family="Arial, sans-serif" font-size="20">Comparison does not measure national wealth, cultural value, or perfectly harmonized exchange universes.</text>
</svg>
