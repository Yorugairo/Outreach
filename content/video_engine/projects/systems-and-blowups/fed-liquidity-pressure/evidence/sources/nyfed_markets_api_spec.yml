  repo-fixed-rate-tranche:
   description: Results for a specific security type for a specific auction method. For Reverse Repo only.
   properties:
    securityType:
     type: string 
     example: Treasury 
     enum: [Treasury, Agency, Mortgage-Backed, SRF]
    amtSubmitted:
     type: number
     example: 90000000
    amtAccepted:
     type: number
     example: 90000000     
    percentAwardRate:
     type: number
     example: 0.05         
    minimumBidRate:
     type: number
     example: 0.02         
    maximumBidRate:
     type: number
     example: 0.05         
    percentOfferingRate:
     type: number
     example: 0.02              
  repo-multiple-price-tranche:
   description: Results for a specific security type for a specific auction method. For Repo and Reverse Repo.
   properties:
    securityType:
     type: string 
     example: Agency 
     enum: [Treasury, Agency, Mortgage-Backed, SRF]
    amtSubmitted:
     type: number
     example: 90000000
    amtAccepted:
     type: number
     example: 90000000   
    minimumBidRate:
     type: number
     example: 0.02         
    maximumBidRate:
     type: number
     example: 0.05         
    percentOfferingRate:
     type: number
     example: 0.02                   
    percentHighRate:
     type: number
     nullable: true
     description: Only available if amtSubmitted and amtAccepted are greater than 0
     example: 1.79               
    percentLowRate:
     type: number
     nullable: true
     description: Only available if amtSubmitted and amtAccepted are greater than 0
     example: 1.01                    
    percentStopOutRate:
     type: number
     nullable: true
     description: Only available if amtSubmitted and amtAccepted are greater than 0
     example: 1.46                        
    percentWeightedAverageRate:
     type: number
     nullable: true
     description: Only available if amtSubmitted and amtAccepted are greater than 0
     example: 1.123        
