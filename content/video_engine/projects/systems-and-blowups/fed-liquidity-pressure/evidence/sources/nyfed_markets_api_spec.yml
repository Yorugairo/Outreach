    description: Public
  - url: https://markets.newyorkfed.org/beta
    description: Public Beta
tags:
 - name: Agency Mortgage-Backed Securities Operations
   description: Outrights, Dollar Rolls and Coupon Swaps  
 - name: Central Bank Liquidity Swaps  Operations  
   description: U.S. Dollar and Non-U.S. Dollar         
 - name: Guide Sheets 
   description: FR 2004SI, FR 2004WI,  FR 2004F-Series  
 - name: Primary Dealer Statistics 
   description: Series of Surveys (Please take note that *timeseries* and *keyid* are used interchangeably)  
 - name: Primary Dealer Statistics Market Share
   description: Quarterly and Year-To-Date
 - name: Reference Rates  
   description: Secured and Unsecured      
 - name: Repo and Reverse Repo Operations 
   description: Repo, Reverse Repo and Propositions            
 - name: Securities Lending Operations  
   description: Securities Lending and Extensions   
 - name: System Open Market Account Holdings  
   description: SOMA Holdings (Please take note that Agency includes Agency Debts, MBS, and CMBS. Treasury includes Bills, Notes/Bonds, FRN, and TIPS.)    
 - name: Treasury Securities Operations 
   description: Outrights and Prices Paid (Please take note that Prices Paid are included in operations detail when available)  
components:
 schemas:
