     example: Results
    operationId:
     type: string
     example: OR 122120 1
    operationDate:
     type: string
     format: date  
    operationType:
     type: string 
     example: Outright TBA Purchase
    operationDirection:
     type: string 
     example: P 
     enum: [P, S]
    method:
     type: string 
     enum: [Multiple Price, Single Price]
     example: Multiple Price       
    releaseTime:
     type: string
     example: '10:10'          
    closeTime:
     type: string
     example: '10:30'          
    classType:
     type: string
     example: B 
