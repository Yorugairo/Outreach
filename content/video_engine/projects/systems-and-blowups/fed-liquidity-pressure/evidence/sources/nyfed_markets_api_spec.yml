paths:
# ====================
# AMBS
# ====================
 /api/ambs/{operation}/{status}/{include}/latest.{format}:
  get:
   tags:
    - Agency Mortgage-Backed Securities Operations
   summary: Current date operations
   description: Returns the latest AMBS operation Announcements or Results for the current day. 
   produces:
    - application/json
    - text/xml
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
