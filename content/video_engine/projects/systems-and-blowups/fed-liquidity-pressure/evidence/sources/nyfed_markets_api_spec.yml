 examples:
  ambs-rss-xml-example:
   value: |
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns="http://purl.org/rss/1.0/" xmlns:cb="http://www.cbwiki.net/wiki/index.php/Specification_1.1" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.w3.org/1999/02/22-rdf-syntax-ns# rdf.xsd">
      <channel rdf:about="https://markets.newyorkfed.org/rss/feeds/ambs">
        <title>NY Fed | Agency Mortgage-Backed Securities Operations</title>
        <link>https://www.newyorkfed.org/rss/index.html</link>
        <description>Monetary policy can be implemented through outright purchases or sales of securities, which permanently change the size of the Federal Reserve's System Open Market Account (SOMA) portfolio.</description>
        <items>
          <rdf:Seq>
            <rdf:li rdf:resource="https://www.newyorkfed.org/markets/desk-operations/ambs" />
          </rdf:Seq>
        </items>
        <dc:publisher>Federal Reserve Bank of New York</dc:publisher>
        <dcterms:license>https://www.newyorkfed.org/termsofuse.html</dcterms:license>
      </channel>
      <item rdf:about="https://www.newyorkfed.org/markets/desk-operations/ambs">
        <title>US: $2.601B TBA Purchase 2020-12-28 NY Fed Agency Mortgage-Backed Securities Operations</title>
        <link>https://www.newyorkfed.org/markets/desk-operations/ambs</link>
        <description xml:lang="en">Monetary policy can be implemented through outright purchases or sales of securities, which permanently change the size of the Federal Reserve's System Open Market Account (SOMA) portfolio.</description>
        <dc:date>2020-12-28T00:00:00-05:00</dc:date>
        <dc:language>en</dc:language>
        <cb:statistics>
          <cb:country>US</cb:country>
          <cb:institutionAbbrev>NYFed</cb:institutionAbbrev>
          <cb:transaction>
            <cb:value frequency="daily" unit_mult="9" units="USD" decimal="3">2.601</cb:value>
            <cb:transactionType>Agency Mortgage-Backed Securities Operations</cb:transactionType>
            <cb:transactionName>TBA Purchase</cb:transactionName>
          </cb:transaction>
        </cb:statistics>
      </item>
    </rdf:RDF>
