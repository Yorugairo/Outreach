info:
  title: Markets Data APIs  
  description: |

    <div id="email-alert">
      <form action="https://public.govdelivery.com/accounts/USFRBNEWYORK/subscribers/qualify">
        <input id="topic_id" name="topic_id" type="hidden" value="USFRBNEWYORK_512">
        <fieldset>
          <div id="email-alert-title">receive e-mail alerts for this page</div>
          <div id="email-alert-textbox">
            <input name="email" id="email" size="20" placeholder="enter your email" type="text">
          </div>
          <div id="email-alert-button_panel">
            <input id="form_button" name="commit" value="Submit" type="submit">
          </div>
        </fieldset>
      </form>
    </div>

    ## Introduction
    The Markets Data APIs are provided to external users and applications to request data from the Federal Reserve Bank of New York. The APIs are architected using RESTful interface, with structured semantic URLs. As these APIs are intended to be consumed by a variety of systems, the data they return are in multiple formats. The supported formats are JSON, XML, PDF, CSV, and Microsoft Excel. This interactive documentation outlines how to use these services. 
 
    
    ## Notice
    Use of reference rates, the Markets Data APIs, and all data accessible through the Markets Data APIs is subject to the [Terms of Use]( https://www.newyorkfed.org/privacy/termsofuse) for the Federal Reserve Bank of New York website.

    Reference rates, including the Effective Federal Funds Rate (EFFR), Overnight Bank Funding Rate (OBFR),  Tri-Party General Collateral Rate (TGCR), Broad General Collateral Rate (BGCR), Secured Overnight Financing Rate (SOFR), and SOFR Averages and Index (SOFR-avg-ind) are subject to important disclaimers, conditions, limitations, and indemnification obligations described in the [Terms of Use](https://www.newyorkfed.org/privacy/termsofuse).

    ## Version and Beta Support  
    The Markets Data APIs do not support multiple production versions. 

    The default endpoints are backed by the latest official service implementation. When upgrades or new features are implemented, best effort will be made to make them first available in beta version so that consumers may test their systems against the updates before they go live. To access a service’s beta version, preface the path with the /beta node.    
    
    Data provided in beta are for testing purposes only and are not regularly maintained.  
    ```
    /beta/api/ambs/all/results/details/last/1.json  
    ```
    
    ## Last Updated: June 12, 2026
   
    ## RESTful Services
    ### Response Codes and Content 
    Valid requests will return with an HTTP 200 and data in the requested format. An invalid request (e.g. invalid token/element in the path or an unsupported format/extension) results in an HTTP 400. Requests are validated to ensure conformity to defined perimeters. If a request fails validation, an HTTP 400 will be returned, and the response body will contain a JSON string array with descriptive messages of the validation failures.
    
    ### How to use 
    Expand each area to see available methods and features including parameters, formats, responses, and sample data.  Use “Try it out” to build requests.
    
    Base URL will be production unless Beta Mode is selected.

    **Please take note of the following when using:**  
      * Data returned is based on parameters provided.
      * Date must be entered in required format. Start and End dates are defaulted to current date when not provided. 
      * Formats that result in file downloads (e.g. Microsoft Excel, PDF) are not returned interactively on this page. To see data, click on “Download file” in the “Server response” area.
      * Requests that return very large datasets may not be presentable in the browser or may slow down browser's response. 


  version: "1.0"
servers:
