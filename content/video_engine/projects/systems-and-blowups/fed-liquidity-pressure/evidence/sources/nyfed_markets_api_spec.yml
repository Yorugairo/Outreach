 /api/tsy/{operation}/{status}/{include}/latest.{format}:
  get:
   tags:
    - Treasury Securities Operations
   summary: Current date operations
   description: Returns the latest Treasury operation Announcements or Results for the current day.
   produces:
    - application/json
    - text/xml
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
   parameters:
    - in: path
      name: operation
      required: true
      description: The operation type
      schema:
       type: string
       enum: [all,purchases,sales]
    - in: path
      name: status
      required: true
      description: The operation status
      schema:
       type: string
       enum: [announcements,results,operations]
    - in: path
      name: include
      required: true
      description: The level of details to include
      schema:
       type: string
       enum: [summary,details]            
    - in: path
      name: format
      required: true
      description: The format of the response
      schema:
       type: string
       enum: [json,xml,csv,xlsx]                        
   responses:
    '200':
     $ref: '#/components/responses/tsy-response'
    '400':
     $ref: '#/components/responses/bad-request'
    '5XX':
     $ref: '#/components/responses/unexpected-error'                                    
