  repo-release-record:
   description: Represents an operation announcement, extension, or cancellation. Can represent either a Repo or Reverse Repo operation.
   properties:
    operationId:   
     type: string
     example: "RP 062221 1"                
    operationDate:   
     type: string
     format: date
     example: "2021-06-22"     
    auctionStatus:
     type: string
     enum: [Released, Extended, Cancelled]
     example: Released                    
    settlementDate:   
     type: string
     format: date
     example: "2021-06-22"             
    maturityDate:   
     type: string
     format: date
     example: "2021-06-22"                  
    operationType:   
     type: string
     enum: [Repo,Reverse Repo]
     example: "Reverse Repo"                       
    operationMethod:   
     type: string
     enum: ["Multiple Price", "Single Price", "Fixed Rate","Full Allotment"]
    settlementType:   
     type: string
     example: "Same Day"                                 
    termCalenderDays:   
     type: number
     example: 1
    closeTime:
     type: string
     example: '13:15'      
    lastUpdated:
     type: string
     format: date-time  
     example: '2020-12-23 10:21:49'     
    note:
     type: string  
     default: ''          
  repo-result-record:
   description: A Repo operation results. Post operation data (settlementAmts) is included once available  
   properties:
    operationId:   
     type: string
     example: "RP 062221 1"                
    operationDate:   
     type: string
     format: date
     example: "2021-06-22"        
    auctionStatus:
     type: string
     example: Results          
    settlementDate:   
     type: string
     format: date
     example: "2021-06-22"             
    maturityDate:   
     type: string
     format: date
     example: "2021-06-22"                  
    operationType:   
     type: string
     example: "Repo"                       
    operationMethod:   
     type: string
     enum: ["Multiple Price", "Single Price", "Fixed Rate"]
    settlementType:   
     type: string
     example: "Same Day"                                 
    termCalenderDays:   
     type: number
     example: 1
    closeTime:
     type: string
     example: '13:15'               
    totalAmtSubmitted:
     type: number
     example: 791605000000 
    totalAmtAccepted:
     type: number
     example: 791605000000 
    participatingCpty:
     type: number
     nullable: true
     example: 74 
    acceptedCpty:
     type: number
     nullable: true
     example: 74
    lastUpdated:
     type: string
     format: date-time  
     example: '2020-12-23 10:21:49'
    note:
     type: string  
     default: ''     
    details:
     type: array
     description: Contains results for specific tranches (Mortgage-Backed, Agency, Treasury, or SRF). The properties available depend on the operation method
     xml:
      wrapped: true
      name: details
     items:
      xml:
       name: detail
      oneOf:
       - $ref: '#/components/schemas/repo-multiple-price-tranche'
       - $ref: '#/components/schemas/repo-single-price-tranche'  
      discriminator:      
       propertyName: operationMethod
       mapping:
        Multiple Price: '#/components/schemas/repo-multiple-price-tranche'
        Single Price: '#/components/schemas/repo-single-price-tranche'     
    settlementAmts:
     type: array
     nullable: true
     description: Populated only for Repos and when post operation data is available
     xml:
      wrapped: true
      name: settlementAmts
     items:
      xml:
       name: settlementAmt
      oneOf:
       - $ref: '#/components/schemas/settlement-amount-record'                      
  reverserepo-result-record:
   description: A Reverse Repo operation results. Post operation data (propositions) is included once available  
   properties:
    operationId:   
     type: string
     example: "RP 062221 1"                
    operationDate:   
     type: string
     format: date
     example: "2021-06-22"   
    auctionStatus:
     type: string
     example: Results               
    settlementDate:   
     type: string
     format: date
     example: "2021-06-22"             
    maturityDate:   
     type: string
     format: date
     example: "2021-06-22"                  
    operationType:   
     type: string
     example: "Reverse Repo"                       
    operationMethod:   
     type: string
     enum: ["Multiple Price", "Single Price", "Fixed Rate"]
    settlementType:   
     type: string
     example: "Same Day"                                 
    termCalenderDays:   
     type: number
     example: 1
    closeTime:
     type: string
     example: '13:15'               
    totalAmtSubmitted:
     type: number
     example: 791605000000 
    totalAmtAccepted:
     type: number
     example: 791605000000 
    participatingCpty:
     type: number
     nullable: true
     example: 74 
    acceptedCpty:
     type: number
     nullable: true
     example: 74
    lastUpdated:
     type: string
     format: date-time  
     example: '2020-12-23 10:21:49'     
    note:
     type: string  
     default: ''          
    details:
     type: array
     description: Contains results for specific tranches (Mortgage-Backed, Agency, Treasury, or SRF). The properties available depend on the operation method
     xml:
      wrapped: true
      name: details
     items:
      xml:
       name: detail
      oneOf:
       - $ref: '#/components/schemas/repo-multiple-price-tranche'
       - $ref: '#/components/schemas/repo-single-price-tranche'  
       - $ref: '#/components/schemas/repo-fixed-rate-tranche' 
      discriminator:      
       propertyName: operationMethod
       mapping:
        Multiple Price: '#/components/schemas/repo-multiple-price-tranche'
        Single Price: '#/components/schemas/repo-single-price-tranche'     
        Fixed Rate: '#/components/schemas/repo-fixed-rate-tranche' 
    propositions:
     type: array
     nullable: true
     description: Populated only for Reverse Repos and when post operation data is available
     xml:
      wrapped: true
      name: propositions
     items:
      xml:
       name: proposition
      oneOf:
       - $ref: '#/components/schemas/proposition-record'
