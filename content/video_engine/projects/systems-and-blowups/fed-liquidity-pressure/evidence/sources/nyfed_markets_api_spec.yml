    totalAmtAcceptedPar:
     type: string   
     example: '1408000000'          
    settlementDate:
     type: string
     format: date                
    lastUpdated:
     type: string
     format: date-time  
     example: '2020-12-23 10:21:49'
    note:
     type: string  
     default: ''
    details:
     type: array
