 /api/tsy/{operation}/results/{include}/search.{format}:
  get:
   tags:
    - Treasury Securities Operations    
   summary: Filter operations
   description: Returns Treasury operation Results.
   produces:
    - application/json
    - text/xml
    - text/csv
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
   parameters:
    - in: path
      name: operation
      required: true
      description: The operation type
      schema:
       type: string
       enum: [all,purchases,sales]
    - in: path
      name: include
      required: true
      description: The level of details to include
      schema:
       type: string
       enum: [summary,details]            
    - in: path
      name: format
      required: true
      description: The format of the response
      schema:
       type: string
       enum: [json,xml,csv,xlsx]                               
    - in: query
      name: startDate
      required: false
      description: The start date (inclusive) from which to search. <br/> <i>Format yyyy-MM-dd</i> 
      schema:
       type: string
       format: date
       example: "2021-01-01"
    - in: query
      name: endDate
      required: false
      description: The end date (inclusive) up until which to search. <br/> <i>Format yyyy-MM-dd</i>
      schema:
       type: string
       format: date       
       example: "2021-01-02"
    - in: query
      name: securityType
      required: false
      description: Filter by security type. "agency" include Agency Debt. "treasury" includes Bill, Coupon, FRN, TIPS, and Other        
      schema:
       type: string
       enum: [agency, treasury]
    - in: query
      name: cusip
      required: false
      description: Only return operations which include the given CUSIP. Partial identifiers are accepted.
      schema:
       type: string
    - in: query
      name: desc
      required: false
      description: Only return operations which include the given Security Description. Partial identifiers are accepted.
      schema:
       type: string       
   responses:
    '200':
     $ref: '#/components/responses/tsy-response'
    '400':
     $ref: '#/components/responses/bad-request-params'
    '5XX':
     $ref: '#/components/responses/unexpected-error'  
